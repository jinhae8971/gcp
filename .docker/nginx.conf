# Dashboard.json 캐시 무효화 + index 자동 리다이렉트
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index Dashboard.html index.html;

    # JSON 파일은 캐시하지 않음 (5분마다 갱신되므로)
    location ~ \.json$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires off;
    }

    # / → Dashboard.html로 자동 진입
    location = / {
        return 302 /Dashboard.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
