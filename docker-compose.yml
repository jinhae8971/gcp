# 로컬 Docker 환경 — KOSPI Intel + Global Money MOVE 두 대시보드 모두
#
# 사용법:
#   docker compose up -d                              # 기본 서비스 (data + web) 시작 → :8080
#   docker compose logs -f data                       # 코스피 데이터 5분 cron 로그
#   docker compose --profile gmm run --rm gmm-generator   # AI 번들 1회 갱신 (Anthropic API)
#   docker compose down                               # 정리
#
# 또는 Makefile:
#   make up           # data + web 시작
#   make refresh      # AI 번들 1회 갱신
#   make down         # 정리
#   make help         # 전체 명령
#
# 접속:
#   http://localhost:8080/                             메인 인덱스
#   http://localhost:8080/Dashboard.html              KOSPI Intel
#   http://localhost:8080/global_money_flow.html      Global Money MOVE
#
# (선택) KRX / Anthropic 키 설정:
#   cp .env.example .env  → 값 입력 → docker compose up -d 재시작
services:

  # 데이터 생성 — 5분마다 generate_dashboard_data.py 실행 → docs/dashboard_data.json 갱신
  data:
    build: .
    container_name: kospi-intel-data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Seoul
      # PYTHONUNBUFFERED=1로 print 즉시 출력 (logs -f 시 실시간)
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./docs:/app/docs
    command:
      - sh
      - -c
      - |
        echo "[$$(date '+%H:%M:%S')] kospi-intel-data 시작 — 5분 주기 갱신"
        while true; do
          echo "[$$(date '+%H:%M:%S')] 데이터 생성 시작..."
          python generate_dashboard_data.py || echo "[$$(date '+%H:%M:%S')] 생성 실패 (다음 주기 재시도)"
          echo "[$$(date '+%H:%M:%S')] 5분 대기..."
          sleep 300
        done

  # 정적 파일 서버 — docs/ 폴더를 nginx로 서빙
  web:
    image: nginx:alpine
    container_name: kospi-intel-web
    restart: unless-stopped
    ports:
      - "${GMM_WEB_PORT:-8080}:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - data

  # Global Money MOVE 데이터 1회성 생성기 — `--profile gmm` 으로만 켜집니다.
  #   docker compose --profile gmm run --rm gmm-generator
  # 또는: make refresh
  # ANTHROPIC_API_KEY 가 .env 에 있어야 동작합니다 (.env.example 참고).
  gmm-generator:
    image: python:3.11-slim
    container_name: gmm-generator
    profiles: ["gmm"]
    working_dir: /app
    volumes:
      - .:/app
      - gmm-pip-cache:/root/.cache/pip
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY 가 .env 에 설정되어 있어야 합니다}
    command:
      - sh
      - -c
      - |
        pip install --quiet --upgrade anthropic
        python generate_global_flow_data.py
        echo "✓ docs/global_flow_data.json 갱신 완료. 브라우저 새로고침하면 반영됩니다."

volumes:
  gmm-pip-cache:
