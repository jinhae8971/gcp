    transition:transform 0.15s;
  }
  .settings-fab:hover{transform:translateY(-2px) scale(1.05)}
  .settings-drawer{
    position:fixed; right:0; top:0; bottom:0; width:340px; z-index:95;
    background:linear-gradient(180deg, rgba(15,22,42,0.98), rgba(10,15,28,0.98));
    border-left:1px solid var(--line-strong);
    backdrop-filter:blur(16px);
    box-shadow:-12px 0 40px rgba(0,0,0,0.5);
    transform:translateX(100%); transition:transform 0.25s ease;
    display:flex; flex-direction:column;
  }
  .settings-drawer.open{transform:translateX(0)}
  .settings-backdrop{
    position:fixed; inset:0; z-index:94;
    background:rgba(0,0,0,0.35); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }

<script type="text/babel" data-presets="react" id="app-primitives">
// =====================================================================
// UI primitives — Card, Sparkline, Bar, KPI, Chip, LiveTick, Tooltip
// (useState/useEffect/useRef/useMemo/useCallback are exposed on window
//  by the data script via `var {...} = React;`)
// =====================================================================
function Card({ title, subtitle, right, children, padding=true, style, accent, id }){
  return (
    <div id={id} style={{
      background:"linear-gradient(180deg, rgba(20,28,54,0.55), rgba(15,22,42,0.55))",
      border:"1px solid var(--line)", borderRadius:14,
      backdropFilter:"blur(8px)", display:"flex", flexDirection:"column",
      position:"relative", overflow:"hidden",
      scrollMarginTop:120,
      ...style,
    }}>
      {accent && (
        <div style={{
          position:"absolute", top:0, left:0, right:0, height:1,
          background:`linear-gradient(90deg, transparent, ${accent}, transparent)`,
          opacity:0.5,
        }}/>
      )}
      {(title || right) && (
        <div style={{
          display:"flex", alignItems:"center", justifyContent:"space-between",
          padding:"14px 18px 10px",
          borderBottom:"1px solid var(--line)",
        }}>
          <div>
            {title && <div style={{
              fontSize:11, fontWeight:600, letterSpacing:"0.12em",
              color:"var(--text-1)", textTransform:"uppercase",
            }}>{title}</div>}
            {subtitle && <div style={{fontSize:11, color:"var(--text-2)", marginTop:3}}>{subtitle}</div>}
          </div>
          {right}
        </div>
      )}
      <div style={{padding: padding ? "14px 18px 16px" : 0, flex:1, minHeight:0}}>
        {children}
      </div>
    </div>
  );
}

function Sparkline({ data, color="var(--accent-cyan)", height=28, width=100, fill=true, strokeWidth=1.5 }){
  if (!data || data.length<2) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max-min || 1;
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*width;
    const y = height - ((v-min)/range) * (height-2) - 1;
    return [x,y];
  });
  const path = pts.map((p,i)=> (i===0?"M":"L")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const fillPath = path + ` L ${width} ${height} L 0 ${height} Z`;
  const gid = "spark-"+Math.abs(color.split("").reduce((a,c)=>a+c.charCodeAt(0),0))+"-"+width+"-"+height;
  return (
    <svg width={width} height={height} style={{display:"block",overflow:"visible"}}>
      {fill && (
        <>
          <defs>
            <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
              <stop offset="100%" stopColor={color} stopOpacity="0"/>
            </linearGradient>
          </defs>
          <path d={fillPath} fill={`url(#${gid})`} />
        </>
      )}
      <path d={path} fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

function Bar({ value, max, color, height=4, bg="rgba(120,150,210,0.10)" }){
  const pct = Math.max(0, Math.min(100, Math.abs(value)/max*100));
  return (
    <div style={{position:"relative", height, background:bg, borderRadius:height/2, overflow:"hidden"}}>
      <div style={{
        position:"absolute", left:0, top:0, bottom:0, width:`${pct}%`,
        background:`linear-gradient(90deg, ${color}66, ${color})`,
        boxShadow:`0 0 8px ${color}`,
      }}/>
    </div>
  );
}

function DivergingBar({ value, max, posColor="var(--up)", negColor="var(--down)", height=4 }){
  const pct = Math.max(0, Math.min(50, Math.abs(value)/max*50));
  const isPos = value>=0;
  return (
    <div style={{position:"relative", height, background:"rgba(120,150,210,0.06)", borderRadius:height/2}}>
      <div style={{position:"absolute", left:"50%", top:0, bottom:0, width:1, background:"var(--line-strong)"}}/>
      <div style={{
        position:"absolute", top:0, bottom:0,
        ...(isPos ? {left:"50%", width:`${pct}%`} : {right:"50%", width:`${pct}%`}),
        background: isPos
          ? `linear-gradient(90deg, ${posColor}40, ${posColor})`
          : `linear-gradient(270deg, ${negColor}40, ${negColor})`,
        boxShadow: `0 0 8px ${isPos?posColor:negColor}`,
        borderRadius:height/2,
      }}/>
    </div>
  );
}

function formatKpiVal(val, unit, pct){
  if (typeof val !== "number") return val;
  const sign = val>=0 ? "" : "-";
  const abs = Math.abs(val);
  if (pct) return `${val>=0?"+":""}${val.toFixed(1)}%`;
  if (unit==="$B") return `${sign}$${abs>=100?abs.toFixed(0):abs.toFixed(1)}B`;
  if (unit==="%") return `${val>=0?"+":""}${val.toFixed(1)}%`;
  return `${val.toFixed(2)}`;
}

function KPI({ kr, en, val, unit, pct, chg, up, accent, onClick, dim }){
  return (
    <button onClick={onClick} style={{
      flex:1, padding:"14px 18px",
      borderRight:"1px solid var(--line)",
      position:"relative", minWidth:0,
      textAlign:"left", cursor:onClick?"pointer":"default",
      transition:"background 0.15s",
      opacity: dim ? 0.45 : 1,
      background:"transparent",
    }} onMouseEnter={e=>{ if(onClick) e.currentTarget.style.background="rgba(0,229,255,0.04)"; }}
       onMouseLeave={e=>{ e.currentTarget.style.background="transparent"; }}>
      <div style={{
        position:"absolute", left:0, top:14, bottom:14, width:2,
        background:accent, opacity:0.7,
      }}/>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8, marginBottom:6}}>
        <div style={{fontSize:10.5, color:"var(--text-2)", letterSpacing:"0.08em", textTransform:"uppercase", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>
          {kr} <span style={{color:"var(--text-3)"}}>· {en}</span>
        </div>
      </div>
      <div style={{display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap"}}>
        <div className="num" style={{fontSize:22, fontWeight:600, color:"var(--text-0)"}}>
          {formatKpiVal(val, unit, pct)}
        </div>
        <div className="num" style={{fontSize:12, color: up ? "var(--up)" : "var(--down)", fontWeight:500}}>
          {up ? "▲" : "▼"} {chg}
        </div>
      </div>
    </button>
  );
}

function Chip({ children, color="var(--text-2)", active=false, onClick, style }){
  return (
    <button onClick={onClick} style={{
      padding:"5px 10px", fontSize:11, letterSpacing:"0.04em",
      borderRadius:6,
      border:`1px solid ${active ? color : "var(--line-strong)"}`,
      background: active ? `${color}1A` : "transparent",
      color: active ? "var(--text-0)" : "var(--text-1)",
      cursor: onClick ? "pointer" : "default",
      transition:"all 0.15s", whiteSpace:"nowrap",
      fontFamily:"inherit",
      ...style,
    }}>
      {children}
    </button>
  );
}

function LiveTick(){
  const [now, setNow] = useState(new Date());
  useEffect(()=>{
    const id = setInterval(()=>setNow(new Date()), 1000);
    return ()=>clearInterval(id);
  },[]);
  const pad = n=>String(n).padStart(2,"0");
  const t = `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} UTC`;
  return (
    <div style={{display:"flex", alignItems:"center", gap:8, fontSize:11, color:"var(--text-1)"}} className="mono">
      <span style={{
        width:6, height:6, borderRadius:3, background:"var(--up)",
        boxShadow:"0 0 8px var(--up)", animation:"pulse 2s ease-in-out infinite",
      }}/>
      <span>LIVE</span>
      <span style={{color:"var(--text-3)"}}>·</span>
      <span style={{color:"var(--text-1)"}}>{t}</span>
    </div>
  );
}

(function injectKeyframes(){
  if (document.getElementById("__gmm-keyframes")) return;
  const s = document.createElement("style");
  s.id = "__gmm-keyframes";
  s.textContent = `
    @keyframes pulse { 0%,100% {opacity:1; transform:scale(1)} 50% {opacity:0.4; transform:scale(0.8)} }
    @keyframes flowDash { to { stroke-dashoffset: -200; } }
    @keyframes glowPulse { 0%,100% {opacity:0.4} 50% {opacity:1} }
  `;
  document.head.appendChild(s);
})();

Object.assign(window, { Card, Sparkline, Bar, DivergingBar, KPI, Chip, LiveTick, formatKpiVal });
</script>
<script type="text/babel" data-presets="react" id="app-hero-map">
// =====================================================================
// Hero map — stylized world map with animated flow arcs
// =====================================================================
const CONTINENT_PATHS = [
  "M 8 22 L 14 18 L 22 19 L 28 25 L 30 32 L 28 38 L 24 44 L 22 50 L 18 52 L 14 50 L 12 44 L 8 38 L 6 30 Z",
  "M 24 56 L 28 54 L 32 58 L 33 66 L 30 76 L 28 82 L 26 80 L 24 72 L 23 64 Z",
  "M 42 26 L 50 24 L 54 28 L 56 34 L 52 38 L 48 36 L 44 34 L 42 30 Z",
  "M 46 42 L 54 40 L 58 46 L 58 56 L 56 64 L 52 72 L 48 70 L 46 60 L 44 50 Z",
  "M 56 38 L 62 38 L 64 44 L 60 48 L 56 46 Z",
  "M 56 18 L 70 16 L 84 18 L 88 22 L 86 28 L 76 30 L 64 28 L 56 24 Z",
  "M 64 44 L 70 44 L 72 50 L 70 56 L 66 54 L 64 50 Z",
  "M 72 30 L 82 30 L 86 36 L 84 42 L 78 44 L 74 40 Z",
  "M 76 50 L 82 50 L 84 56 L 80 62 L 78 60 L 76 56 Z",
  "M 86 38 L 90 36 L 92 42 L 90 46 L 86 44 Z",
  "M 78 70 L 86 70 L 90 76 L 88 82 L 80 82 L 78 76 Z",
];
function parsePathToPoly(d){
  const tokens = d.match(/[MLZ]|-?\d+(\.\d+)?/g);
  const pts = []; let i = 0;
  while (i < tokens.length){
    const t = tokens[i];
    if (t==="M" || t==="L"){ pts.push([parseFloat(tokens[i+1]), parseFloat(tokens[i+2])]); i+=3; }
    else if (t==="Z"){ i++; } else { i++; }
  }
  return pts;
}
function pointInPoly(x,y,poly){
  let inside=false;
  for (let i=0,j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
const CONTINENT_POLYS = CONTINENT_PATHS.map(parsePathToPoly);
const DOT_GRID = (function(){
  const dots = []; const step = 1.6;
  for (let y = 12; y < 90; y += step){
    for (let x = 4; x < 96; x += step){
      const offX = (Math.floor(y/step)%2===0) ? 0 : step/2;
      const px = x + offX;
      for (let p of CONTINENT_POLYS){
        if (pointInPoly(px, y, p)){ dots.push([px, y]); break; }
      }
    }
  }
  return dots;
})();
function arcPath(x1,y1,x2,y2,curve=0.3){
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const dx = x2-x1, dy = y2-y1;
  const dist = Math.hypot(dx,dy);
  const nx = -dy/dist, ny=dx/dist;
  const cx = mx + nx * dist * curve;
  const cy = my + ny * dist * curve - dist*0.15;
  return { d:`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`, cx, cy };
}

function HeroMap({ scrub, filterAsset, periodFactor }){
  const [hover, setHover] = useState(null);
  const [hoverFlow, setHoverFlow] = useState(null);
  const containerRef = useRef(null);

  const flows = useMemo(()=>{
    return GEO_FLOWS.filter(f => filterAsset==="all" || f.asset===filterAsset);
  }, [filterAsset]);

  const W = 100, H = 100;

  return (
    <div ref={containerRef} style={{
      position:"relative", width:"100%", height:"100%",
      background:"radial-gradient(ellipse at center, rgba(0,229,255,0.04), transparent 60%)",
    }}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" style={{
        width:"100%", height:"100%", display:"block",
      }}>
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="0.6" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="1.4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <pattern id="grat" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 10 0 L 0 0 0 10" fill="none" stroke="var(--grid)" strokeWidth="0.08"/>
          </pattern>
        </defs>

        <rect x="0" y="0" width={W} height={H} fill="url(#grat)" opacity="0.6"/>
        <line x1="0" y1="50" x2={W} y2="50" stroke="rgba(120,150,210,0.10)" strokeWidth="0.08" strokeDasharray="0.6 0.6"/>
        <line x1="0" y1="35" x2={W} y2="35" stroke="rgba(120,150,210,0.06)" strokeWidth="0.06" strokeDasharray="0.4 0.6"/>
        <line x1="0" y1="65" x2={W} y2="65" stroke="rgba(120,150,210,0.06)" strokeWidth="0.06" strokeDasharray="0.4 0.6"/>

        <g>{DOT_GRID.map(([x,y], i) => (
          <circle key={i} cx={x} cy={y} r="0.32" fill="rgba(120,150,210,0.32)"/>
        ))}</g>

        <g>
          {flows.map((f,i)=>{
            const from = GEO_NODES[f.from], to = GEO_NODES[f.to];
            if (!from || !to) return null;
            const { d } = arcPath(from.x, from.y, to.x, to.y);
            const colorVar = `var(--accent-${f.color})`;
            const scaledValue = f.value * periodFactor;
            const strokeW = 0.08 + Math.min(0.45, scaledValue/100);
            const isHover = hoverFlow===i;
            // scrub-driven dash phase: makes the line "fill in" as scrub progresses
            const dashLen = 200;
            const dashOffset = (1 - (scrub ?? 0)) * dashLen;
            return (
              <g key={i}>
                <path d={d} fill="none" stroke={colorVar}
                  strokeWidth={strokeW}
                  opacity={isHover ? 0.95 : 0.32}
                  filter="url(#glow)"
                  strokeDasharray={`${dashLen}`}
                  strokeDashoffset={dashOffset}
                  style={{transition:"stroke-dashoffset 0.15s linear"}}
                />
                <circle r={0.4 + Math.min(0.6, scaledValue/120)} fill={colorVar} filter="url(#glowStrong)">
                  <animateMotion dur={`${3 + (i%4)*0.5}s`} repeatCount="indefinite" path={d}/>
                  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur={`${3 + (i%4)*0.5}s`} repeatCount="indefinite"/>
                </circle>
                <circle r={0.3 + Math.min(0.4, scaledValue/200)} fill={colorVar} filter="url(#glow)" opacity="0.7">
                  <animateMotion dur={`${3 + (i%4)*0.5}s`} repeatCount="indefinite" begin={`${1.5 + (i%3)*0.2}s`} path={d}/>
                </circle>
                <path d={d} fill="none" stroke="transparent" strokeWidth="2"
                  style={{cursor:"pointer", pointerEvents:"stroke"}}
                  onMouseEnter={()=>setHoverFlow(i)}
                  onMouseLeave={()=>setHoverFlow(null)}
                />
              </g>
            );
          })}
        </g>

        <g>
          {Object.entries(GEO_NODES).map(([id, n]) => {
            const inflow = GEO_FLOWS.filter(f=>f.to===id).reduce((s,f)=>s+f.value,0);
            const outflow = GEO_FLOWS.filter(f=>f.from===id).reduce((s,f)=>s+f.value,0);
            const total = (inflow + outflow) * periodFactor;
            const r = 0.6 + Math.min(1.6, total/120);
            const isMajor = total > 30;
            const isHover = hover===id;
            return (
              <g key={id} style={{cursor:"pointer"}}
                 onMouseEnter={()=>setHover(id)} onMouseLeave={()=>setHover(null)}>
                {isMajor && (
                  <circle cx={n.x} cy={n.y} r={r*2.4} fill="none" stroke="var(--accent-cyan)" strokeWidth="0.06" opacity="0.35"/>
                )}
                {isMajor && (
                  <circle cx={n.x} cy={n.y} r="0.6" fill="none" stroke="var(--accent-cyan)" strokeWidth="0.12" opacity="0">
                    <animate attributeName="r" values="0.6;3" dur="2.4s" repeatCount="indefinite" begin={`${(parseInt(n.x)%5)*0.4}s`}/>
                    <animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite" begin={`${(parseInt(n.x)%5)*0.4}s`}/>
                  </circle>
                )}
                <circle cx={n.x} cy={n.y} r={r} fill="var(--bg-0)" stroke="var(--accent-cyan)" strokeWidth="0.18" filter="url(#glow)"/>
                <circle cx={n.x} cy={n.y} r={r*0.4} fill="var(--accent-cyan)" filter="url(#glow)"/>
                {isHover && <circle cx={n.x} cy={n.y} r={r*1.8} fill="none" stroke="var(--accent-cyan)" strokeWidth="0.15" opacity="0.6"/>}
                {(isMajor || isHover) && (
                  <text x={n.x} y={n.y - r - 0.8} textAnchor="middle"
                    style={{fontSize:1.6, fill:isHover?"var(--text-0)":"var(--text-1)", fontWeight:600, fontFamily:"Pretendard, sans-serif", letterSpacing:"0.02em"}}>
                    {n.kr}
                  </text>
                )}
              </g>
            );
          })}
        </g>
      </svg>

      {hover && (() => {
        const n = GEO_NODES[hover];
        const inflows = GEO_FLOWS.filter(f=>f.to===hover);
        const outflows = GEO_FLOWS.filter(f=>f.from===hover);
        const inSum = inflows.reduce((s,f)=>s+f.value,0) * periodFactor;
        const outSum = outflows.reduce((s,f)=>s+f.value,0) * periodFactor;
        return (
          <div style={{
            position:"absolute", left:`${n.x}%`, top:`${n.y}%`,
            transform:"translate(20px, -50%)",
            background:"rgba(8,12,24,0.96)", border:"1px solid var(--line-strong)",
            borderRadius:10, padding:"12px 14px", minWidth:200,
            backdropFilter:"blur(12px)",
            boxShadow:"0 12px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,229,255,0.15)",
            pointerEvents:"none", zIndex:50,
          }}>
            <div style={{fontSize:13, fontWeight:600, color:"var(--text-0)", marginBottom:2}}>
              {n.kr} <span style={{color:"var(--text-3)", fontWeight:400, fontSize:11}}>· {n.en}</span>
            </div>
            <div style={{height:1, background:"var(--line)", margin:"8px 0"}}/>
            <div style={{display:"grid", gridTemplateColumns:"1fr auto", gap:"4px 12px", fontSize:11}}>
              <span style={{color:"var(--text-2)"}}>유입 (Inflow)</span>
              <span className="num" style={{color:"var(--up)", fontWeight:600}}>+${inSum.toFixed(1)}B</span>
              <span style={{color:"var(--text-2)"}}>유출 (Outflow)</span>
              <span className="num" style={{color:"var(--down)", fontWeight:600}}>-${outSum.toFixed(1)}B</span>
              <span style={{color:"var(--text-2)"}}>순흐름 (Net)</span>
              <span className="num" style={{color: inSum-outSum>=0?"var(--up)":"var(--down)", fontWeight:600}}>
                {inSum-outSum>=0?"+":""}${(inSum-outSum).toFixed(1)}B
              </span>
            </div>
          </div>
        );
      })()}

      {hoverFlow!==null && flows[hoverFlow] && (() => {
        const f = flows[hoverFlow];
        const from = GEO_NODES[f.from], to = GEO_NODES[f.to];
        const midX = (from.x+to.x)/2;
        const midY = (from.y+to.y)/2 - 6;
        const ASSET_KR = {equities:"주식", bonds:"채권", gold:"금", commodities:"원자재", cash:"현금"};
        const v = f.value * periodFactor;
        return (
          <div style={{
            position:"absolute", left:`${midX}%`, top:`${midY}%`,
            transform:"translate(-50%, -100%)",
            background:"rgba(8,12,24,0.96)", border:"1px solid var(--line-strong)",
            borderRadius:8, padding:"8px 12px", backdropFilter:"blur(12px)",
            pointerEvents:"none", whiteSpace:"nowrap", zIndex:50,
            boxShadow:"0 8px 24px rgba(0,0,0,0.6)",
          }}>
            <div style={{fontSize:11, color:"var(--text-1)", marginBottom:2}}>
              <span style={{color:"var(--text-0)", fontWeight:600}}>{from.kr}</span>
              <span style={{margin:"0 6px", color:`var(--accent-${f.color})`}}>→</span>
              <span style={{color:"var(--text-0)", fontWeight:600}}>{to.kr}</span>
            </div>
            <div className="num" style={{fontSize:13, fontWeight:600, color:`var(--accent-${f.color})`}}>
              ${v.toFixed(1)}B <span style={{fontSize:10, color:"var(--text-2)", fontWeight:400}}>· {ASSET_KR[f.asset]}</span>
            </div>
          </div>
        );
      })()}

      <div style={{
        position:"absolute", bottom:14, left:16,
        display:"flex", flexDirection:"column", gap:6,
        fontSize:10, color:"var(--text-2)", letterSpacing:"0.06em",
      }} className="mono">
        <div style={{display:"flex", alignItems:"center", gap:6}}>
          <div style={{width:10, height:1.5, background:"var(--accent-cyan)", boxShadow:"0 0 8px var(--accent-cyan)"}}/>
          <span>주식 EQUITIES</span>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:6}}>
          <div style={{width:10, height:1.5, background:"var(--accent-purple)", boxShadow:"0 0 8px var(--accent-purple)"}}/>
          <span>채권 BONDS</span>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:6}}>
          <div style={{width:10, height:1.5, background:"var(--accent-amber)", boxShadow:"0 0 8px var(--accent-amber)"}}/>
          <span>금/원자재 GOLD/CMDTY</span>
        </div>
      </div>

      <div style={{
        position:"absolute", bottom:14, right:16,

<script type="text/babel" data-presets="react" id="app-hero-other">
// =====================================================================
// Hero — Sankey, Chord, Bubble
// =====================================================================
function HeroSankey({ periodFactor }){
  const W = 100, H = 100;
  const left = SANKEY_NODES.filter(n=>n.side===0);
  const right = SANKEY_NODES.filter(n=>n.side===1);
  const totalsBySide = (side, nodes) => nodes.map(n => {
    const total = (side===0
      ? SANKEY_LINKS.filter(l=>l.from===n.id).reduce((s,l)=>s+l.value,0)
      : SANKEY_LINKS.filter(l=>l.to===n.id).reduce((s,l)=>s+l.value,0)) * periodFactor;
    return { ...n, total };
  });
  const leftSized = totalsBySide(0, left);
  const rightSized = totalsBySide(1, right);
  const totalLeft = leftSized.reduce((s,n)=>s+n.total,0) || 1;
  const totalRight = rightSized.reduce((s,n)=>s+n.total,0) || 1;
  const padY = 6, gap = 1.4;
  const usableH = 100 - padY*2 - gap*Math.max(leftSized.length, rightSized.length);

  let yL = padY;
  const leftLayout = leftSized.map(n => {
    const h = (n.total/totalLeft) * usableH;
    const y = yL; yL += h + gap;
    return { ...n, y, h };
  });
  let yR = padY;
  const rightLayout = rightSized.map(n => {
    const h = (n.total/totalRight) * usableH;
    const y = yR; yR += h + gap;
    return { ...n, y, h };
  });

  const leftOffsets = {}, rightOffsets = {};
  leftLayout.forEach(n=>leftOffsets[n.id]=0);
  rightLayout.forEach(n=>rightOffsets[n.id]=0);

  const linkPaths = SANKEY_LINKS.map((l, idx) => {
    const ln = leftLayout.find(n=>n.id===l.from);
    const rn = rightLayout.find(n=>n.id===l.to);
    if (!ln || !rn || ln.total===0 || rn.total===0) return null;
    const v = l.value * periodFactor;
    const lh = (v/ln.total) * ln.h;
    const rh = (v/rn.total) * rn.h;
    const ly1 = ln.y + leftOffsets[l.from];
    const ly2 = ly1 + lh;
    const ry1 = rn.y + rightOffsets[l.to];
    const ry2 = ry1 + rh;
    leftOffsets[l.from] += lh;
    rightOffsets[l.to] += rh;
    const x1 = 22, x2 = 78;
    const cx = (x1+x2)/2;
    const d = `M ${x1} ${ly1} C ${cx} ${ly1}, ${cx} ${ry1}, ${x2} ${ry1} L ${x2} ${ry2} C ${cx} ${ry2}, ${cx} ${ly2}, ${x1} ${ly2} Z`;
    return { d, color: ln.color, value: v, from: ln.kr, to: rn.kr, idx };
  });

  const [hover, setHover] = useState(null);

  return (
    <div style={{position:"relative", width:"100%", height:"100%"}}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{width:"100%", height:"100%"}}>
        <defs>
          {["cyan","purple","amber","lime","mag"].map(c => (
            <linearGradient key={c} id={`sk-${c}`} x1="0" x2="1">
              <stop offset="0%" stopColor={`var(--accent-${c})`} stopOpacity="0.45"/>
              <stop offset="100%" stopColor={`var(--accent-${c})`} stopOpacity="0.18"/>
            </linearGradient>
          ))}
        </defs>
        <text x="22" y="3.5" textAnchor="middle" style={{fontSize:1.6, fill:"var(--text-2)", letterSpacing:"0.15em", fontWeight:600}}>FROM · 매도자산</text>
        <text x="78" y="3.5" textAnchor="middle" style={{fontSize:1.6, fill:"var(--text-2)", letterSpacing:"0.15em", fontWeight:600}}>TO · 매수자산</text>

        {linkPaths.map(l => l && (
          <path key={l.idx} d={l.d} fill={`url(#sk-${l.color})`}
            stroke={`var(--accent-${l.color})`} strokeWidth="0.05"
            opacity={hover===null || hover===l.idx ? 1 : 0.25}
            style={{cursor:"pointer", transition:"opacity 0.15s"}}
            onMouseEnter={()=>setHover(l.idx)} onMouseLeave={()=>setHover(null)}
          />
        ))}

        {leftLayout.map(n => (
          <g key={n.id}>
            <rect x="20.5" y={n.y} width="1.5" height={n.h}
              fill={`var(--accent-${n.color})`} filter="drop-shadow(0 0 1px currentColor)"/>
            <text x="19" y={n.y + n.h/2} textAnchor="end" dominantBaseline="middle"
              style={{fontSize:1.7, fill:"var(--text-0)", fontWeight:500}}>{n.kr}</text>
            <text x="19" y={n.y + n.h/2 + 2.2} textAnchor="end" dominantBaseline="middle"
              style={{fontSize:1.3, fill:"var(--text-3)", fontFamily:"JetBrains Mono"}}>${n.total.toFixed(0)}B</text>
          </g>
        ))}
        {rightLayout.map(n => (
          <g key={n.id}>
            <rect x="78" y={n.y} width="1.5" height={n.h}
              fill={`var(--accent-${n.color})`} filter="drop-shadow(0 0 1px currentColor)"/>
            <text x="80" y={n.y + n.h/2} textAnchor="start" dominantBaseline="middle"
              style={{fontSize:1.7, fill:"var(--text-0)", fontWeight:500}}>{n.kr}</text>
            <text x="80" y={n.y + n.h/2 + 2.2} textAnchor="start" dominantBaseline="middle"
              style={{fontSize:1.3, fill:"var(--text-3)", fontFamily:"JetBrains Mono"}}>${n.total.toFixed(0)}B</text>
          </g>
        ))}
      </svg>
      {hover!==null && linkPaths[hover] && (
        <div style={{
          position:"absolute", left:"50%", top:"50%",
          transform:"translate(-50%,-50%)",
          background:"rgba(8,12,24,0.96)", border:"1px solid var(--line-strong)",
          borderRadius:8, padding:"10px 14px", fontSize:12, pointerEvents:"none",
          boxShadow:"0 8px 24px rgba(0,0,0,0.6)",
        }}>
          <div style={{color:"var(--text-1)"}}>
            <b style={{color:"var(--text-0)"}}>{linkPaths[hover].from}</b>
            <span style={{margin:"0 6px"}}>→</span>
            <b style={{color:"var(--text-0)"}}>{linkPaths[hover].to}</b>
          </div>
          <div className="num" style={{fontSize:14, fontWeight:600, color:`var(--accent-${linkPaths[hover].color})`, marginTop:3}}>
            ${linkPaths[hover].value.toFixed(1)}B
          </div>
        </div>
      )}
    </div>
  );
}

function HeroChord({ periodFactor }){
  const cx=50, cy=50, R=34, ringW=2;
  const n = CHORD_CLASSES.length;
  const totals = CHORD_CLASSES.map((_,i)=>{
    let s=0;
    for(let j=0;j<n;j++){ s += CHORD_MATRIX[i][j] + CHORD_MATRIX[j][i]; }
    return s * periodFactor;
  });
  const grandTotal = totals.reduce((a,b)=>a+b,0) || 1;
  const gap = 0.04;
  const arcs = [];
  let cur = -Math.PI/2;
  for (let i=0;i<n;i++){
    const span = (totals[i]/grandTotal) * (Math.PI*2 - gap*n);
    arcs.push({ start: cur, end: cur+span, mid: cur+span/2 });
    cur += span + gap;
  }
  function thickArcD(a0,a1,rOut,rIn){
    const x0o=cx+rOut*Math.cos(a0), y0o=cy+rOut*Math.sin(a0);
    const x1o=cx+rOut*Math.cos(a1), y1o=cy+rOut*Math.sin(a1);
    const x0i=cx+rIn*Math.cos(a1), y0i=cy+rIn*Math.sin(a1);
    const x1i=cx+rIn*Math.cos(a0), y1i=cy+rIn*Math.sin(a0);
    const large = (a1-a0)>Math.PI?1:0;
    return `M ${x0o} ${y0o} A ${rOut} ${rOut} 0 ${large} 1 ${x1o} ${y1o} L ${x0i} ${y0i} A ${rIn} ${rIn} 0 ${large} 0 ${x1i} ${y1i} Z`;
  }

  const offsets = arcs.map(a => a.start);
  const ribbons = [];
  for (let i=0;i<n;i++){
    for (let j=0;j<n;j++){
      const v = CHORD_MATRIX[i][j] * periodFactor;
      if (v<=0 || i===j) continue;
      const span_i = (v/totals[i]) * (arcs[i].end - arcs[i].start);
      const a0_i = offsets[i]; const a1_i = a0_i + span_i; offsets[i] = a1_i;
      const span_j = (v/totals[j]) * (arcs[j].end - arcs[j].start);
      const a0_j = offsets[j]; const a1_j = a0_j + span_j; offsets[j] = a1_j;
      const r = R - ringW - 0.4;
      const p0 = [cx+r*Math.cos(a0_i), cy+r*Math.sin(a0_i)];
      const p1 = [cx+r*Math.cos(a1_i), cy+r*Math.sin(a1_i)];
      const q0 = [cx+r*Math.cos(a1_j), cy+r*Math.sin(a1_j)];
      const q1 = [cx+r*Math.cos(a0_j), cy+r*Math.sin(a0_j)];
      const d = `M ${p0[0]} ${p0[1]} Q ${cx} ${cy} ${q0[0]} ${q0[1]} A ${r} ${r} 0 0 1 ${q1[0]} ${q1[1]} Q ${cx} ${cy} ${p1[0]} ${p1[1]} A ${r} ${r} 0 0 0 ${p0[0]} ${p0[1]} Z`;
      ribbons.push({ d, color: CHORD_CLASSES[i].color, from:i, to:j, value:v });
    }
  }
  const [hover, setHover] = useState(null);

  return (
    <div style={{position:"relative", width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center"}}>
      <svg viewBox="0 0 100 100" style={{width:"100%", height:"100%"}}>
        <defs>
          {CHORD_CLASSES.map(c => (
            <radialGradient key={c.id} id={`ch-${c.color}`}>
              <stop offset="0%" stopColor={`var(--accent-${c.color})`} stopOpacity="0.6"/>
              <stop offset="100%" stopColor={`var(--accent-${c.color})`} stopOpacity="0.2"/>
            </radialGradient>
          ))}
        </defs>
        {arcs.map((a,i)=>(
          <g key={i}>
            <path d={thickArcD(a.start, a.end, R, R-ringW)}
              fill={`var(--accent-${CHORD_CLASSES[i].color})`}
              opacity={hover===null || hover?.from===i || hover?.to===i ? 0.95 : 0.35}
              filter="drop-shadow(0 0 2px currentColor)"
              style={{transition:"opacity 0.15s"}}
            />
            <text x={cx + (R+4)*Math.cos(a.mid)} y={cy + (R+4)*Math.sin(a.mid)}
              textAnchor="middle" dominantBaseline="middle"
              style={{fontSize:2.6, fill:"var(--text-0)", fontWeight:600}}>{CHORD_CLASSES[i].kr}</text>
            <text x={cx + (R+7)*Math.cos(a.mid)} y={cy + (R+7)*Math.sin(a.mid)}
              textAnchor="middle" dominantBaseline="middle"
              style={{fontSize:1.7, fill:"var(--text-3)", fontFamily:"JetBrains Mono"}}>${totals[i].toFixed(0)}B</text>
          </g>
        ))}
        {ribbons.map((r,idx)=>{
          const isH = hover && (hover.from===r.from && hover.to===r.to);
          const dim = hover && !isH;
          return (
            <path key={idx} d={r.d} fill={`url(#ch-${r.color})`}
              stroke={`var(--accent-${r.color})`} strokeWidth="0.1"
              opacity={dim ? 0.1 : 0.7}
              style={{cursor:"pointer", transition:"opacity 0.15s"}}
              onMouseEnter={()=>setHover({from:r.from, to:r.to, value:r.value, color:r.color})}
              onMouseLeave={()=>setHover(null)}
            />
          );
        })}
        <text x={cx} y={cy-2} textAnchor="middle" style={{fontSize:2.2, fill:"var(--text-2)", letterSpacing:"0.14em"}}>자산회전</text>
        <text x={cx} y={cy+2} textAnchor="middle" style={{fontSize:1.6, fill:"var(--text-3)", letterSpacing:"0.14em"}}>ASSET ROTATION</text>
      </svg>
      {hover && (
        <div style={{
          position:"absolute", left:"50%", bottom:14,
          transform:"translateX(-50%)",
          background:"rgba(8,12,24,0.96)", border:"1px solid var(--line-strong)",
          borderRadius:8, padding:"8px 14px", fontSize:12,
          pointerEvents:"none", whiteSpace:"nowrap",
        }}>
          <span style={{color:"var(--text-0)", fontWeight:600}}>{CHORD_CLASSES[hover.from].kr}</span>
          <span style={{color:`var(--accent-${hover.color})`, margin:"0 6px"}}>→</span>
          <span style={{color:"var(--text-0)", fontWeight:600}}>{CHORD_CLASSES[hover.to].kr}</span>
          <span className="num" style={{marginLeft:10, color:`var(--accent-${hover.color})`, fontWeight:600}}>${hover.value.toFixed(1)}B</span>
        </div>
      )}
    </div>
  );
}

function HeroBubble({ periodFactor }){
  const xMin=-6, xMax=28, yMin=-10, yMax=10;
  const sx = v => 10 + ((v-xMin)/(xMax-xMin))*82;
  const sy = v => 92 - ((v-yMin)/(yMax-yMin))*82;
  const sr = aum => 1.2 + Math.sqrt(aum)/8;
  const [hover, setHover] = useState(null);

  return (
    <div style={{position:"relative", width:"100%", height:"100%"}}>
      <svg viewBox="0 0 100 100" style={{width:"100%", height:"100%"}}>
        <rect x={sx(0)} y="10" width={92-sx(0)} height={sy(0)-10} fill="rgba(37,224,138,0.04)"/>
        <rect x="10" y={sy(0)} width={sx(0)-10} height={92-sy(0)} fill="rgba(255,84,112,0.04)"/>
        {[-5,0,5,10,15,20,25].map(v => (
          <g key={v}>
            <line x1={sx(v)} y1="10" x2={sx(v)} y2="92" stroke="var(--grid)" strokeWidth="0.06"/>
            <text x={sx(v)} y="96" textAnchor="middle" style={{fontSize:1.6, fill:"var(--text-3)", fontFamily:"JetBrains Mono"}}>{v>0?"+":""}{v}%</text>
          </g>
        ))}
        {[-8,-4,0,4,8].map(v => (
          <g key={v}>
            <line x1="10" y1={sy(v)} x2="92" y2={sy(v)} stroke="var(--grid)" strokeWidth="0.06"/>
            <text x="8" y={sy(v)} textAnchor="end" dominantBaseline="middle" style={{fontSize:1.6, fill:"var(--text-3)", fontFamily:"JetBrains Mono"}}>{v>0?"+":""}{v}</text>
          </g>
        ))}
        <line x1={sx(0)} y1="10" x2={sx(0)} y2="92" stroke="var(--line-strong)" strokeWidth="0.1"/>
        <line x1="10" y1={sy(0)} x2="92" y2={sy(0)} stroke="var(--line-strong)" strokeWidth="0.1"/>
        <text x="50" y="99.5" textAnchor="middle" style={{fontSize:1.5, fill:"var(--text-2)", letterSpacing:"0.1em"}}>YTD 수익률 →</text>
        <g transform="translate(2, 50) rotate(-90)">
          <text textAnchor="middle" style={{fontSize:1.5, fill:"var(--text-2)", letterSpacing:"0.1em"}}>← 30D 순흐름 ($B) →</text>
        </g>
        <text x="88" y="14" textAnchor="end" style={{fontSize:1.6, fill:"var(--up)", opacity:0.7, fontWeight:600}}>인기 ↗</text>
        <text x="14" y="90" textAnchor="start" style={{fontSize:1.6, fill:"var(--down)", opacity:0.7, fontWeight:600}}>외면 ↙</text>
        {BUBBLE_DATA.map(b => {
          const flowScaled = b.flow * periodFactor;
          const x = sx(b.ret), y = sy(Math.max(yMin, Math.min(yMax, flowScaled))), r = sr(b.aum);
          const isH = hover===b.id;
          return (
            <g key={b.id} style={{cursor:"pointer"}}
               onMouseEnter={()=>setHover(b.id)} onMouseLeave={()=>setHover(null)}>
              <circle cx={x} cy={y} r={r}
                fill={`var(--accent-${b.color})`} opacity={isH?0.45:0.22}
                stroke={`var(--accent-${b.color})`} strokeWidth={isH?0.2:0.1}
                filter="drop-shadow(0 0 2px currentColor)"/>
              <circle cx={x} cy={y} r={r*0.3} fill={`var(--accent-${b.color})`} opacity="0.9"/>
              {(r>2.4 || isH) && (
                <text x={x} y={y-r-0.6} textAnchor="middle" style={{fontSize:1.5, fill:"var(--text-0)", fontWeight:500, pointerEvents:"none"}}>{b.kr}</text>
              )}
            </g>
          );
        })}
      </svg>
      {hover && (() => {
        const b = BUBBLE_DATA.find(x=>x.id===hover);
        const flowScaled = b.flow * periodFactor;
        return (
          <div style={{
            position:"absolute", right:14, top:14,
            background:"rgba(8,12,24,0.96)", border:"1px solid var(--line-strong)",
            borderRadius:8, padding:"10px 14px", fontSize:11, minWidth:160,
            boxShadow:"0 8px 24px rgba(0,0,0,0.6)", pointerEvents:"none",
          }}>
            <div style={{fontWeight:600, fontSize:13, color:"var(--text-0)", marginBottom:6}}>{b.kr}</div>
            <div style={{display:"grid", gridTemplateColumns:"1fr auto", gap:"3px 10px"}} className="num">
              <span style={{color:"var(--text-2)"}}>YTD 수익률</span>
              <span style={{color:b.ret>=0?"var(--up)":"var(--down)", fontWeight:600}}>{b.ret>=0?"+":""}{b.ret}%</span>
              <span style={{color:"var(--text-2)"}}>순흐름 (기간)</span>
              <span style={{color:flowScaled>=0?"var(--up)":"var(--down)", fontWeight:600}}>{flowScaled>=0?"+":""}${flowScaled.toFixed(1)}B</span>
              <span style={{color:"var(--text-2)"}}>AUM</span>
              <span style={{color:"var(--text-0)", fontWeight:600}}>${b.aum}B</span>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

window.HeroSankey = HeroSankey;
window.HeroChord = HeroChord;
window.HeroBubble = HeroBubble;
</script>

function PanelM2({ feedStatus, ai }){
  const W=480, H=180, padL=44, padR=12, padT=16, padB=22;
  const innerW = W-padL-padR, innerH=H-padT-padB;
  const dataset = (feedStatus && feedStatus.data && feedStatus.source !== "sample" && !feedStatus.error)
    ? feedStatus.data : M2_DATA;
  const all = Object.values(dataset).flatMap(d=>d.series);
  const seriesLen = Math.max(...Object.values(dataset).map(d=>d.series.length), 1);
  const yMin = Math.floor(Math.min(...all)-1);
  const yMax = Math.ceil(Math.max(...all)+1);
  const sx = i => padL + (i/(Math.max(seriesLen-1,1)))*innerW;
  const sy = v => padT + (1-(v-yMin)/(yMax-yMin))*innerH;

<script type="text/babel" data-presets="react" id="app-main">
// =====================================================================
// App — header, KPI strip, time controls, hero switcher, layout, drawer
// =====================================================================
const NAV_ITEMS = [
  { id:"top",            kr:"대시보드"   },
  { id:"flow-tracking",  kr:"흐름추적"   },
  { id:"asset-rotation", kr:"자산회전"   },
  { id:"currency-m2",    kr:"통화·M2"    },
  { id:"reports",        kr:"리포트"     },
];

function smoothScrollTo(id){
  const el = id==="top" ? document.body : document.getElementById(id);
  if (!el) return;
  const y = id==="top" ? 0 : el.getBoundingClientRect().top + window.scrollY - 100;
  window.scrollTo({ top:y, behavior:"smooth" });
}

// =====================================================================
// Live data feed — Frankfurter (currencies/DXY), FRED (M2), Alpha Vantage (VIX)
// Keys persisted to localStorage; never sent anywhere except the API itself.
// =====================================================================
const KEYS_LS = "gmm.apiKeys.v1";
function loadKeys(){
  try { return JSON.parse(localStorage.getItem(KEYS_LS) || "{}"); }
  catch { return {}; }
}
function saveKeys(k){
  try { localStorage.setItem(KEYS_LS, JSON.stringify(k)); } catch {}
}
function fmtISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
// Standard ICE DXY weights (as of 1999): EUR -57.6%, JPY +13.6%, GBP -11.9%,
// CAD +9.1%, SEK +4.2%, CHF +3.6%. Frankfurter quotes all rates as "X per 1 USD",
// so for inverse-quoted EUR/GBP we convert via 1/rate inside the same formula:
//   DXY = 50.14348112 × EUR^0.576 × JPY^0.136 × GBP^0.119 × CAD^0.091 × SEK^0.042 × CHF^0.036
function calcDXY(rates){
  if (!rates || !rates.EUR || !rates.JPY || !rates.GBP || !rates.CAD || !rates.SEK || !rates.CHF) return null;
  return 50.14348112
    * Math.pow(rates.EUR, 0.576)
    * Math.pow(rates.JPY, 0.136)
    * Math.pow(rates.GBP, 0.119)
    * Math.pow(rates.CAD, 0.091)
    * Math.pow(rates.SEK, 0.042)
    * Math.pow(rates.CHF, 0.036);
}

async function fetchCurrencyData(){
  const symbols = "EUR,JPY,CNY,KRW,INR,GBP,AUD,SEK,CHF,CAD";
  const end = new Date();
  const start = new Date(); start.setDate(start.getDate() - 45);
  const url = `https://api.frankfurter.app/${fmtISO(start)}..${fmtISO(end)}?base=USD&symbols=${symbols}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Frankfurter HTTP "+r.status);
  const j = await r.json();
  const dates = Object.keys(j.rates).sort();
  if (dates.length < 2) throw new Error("Frankfurter returned no rates");
  const N = dates.length;
  const rateOn = (i) => j.rates[dates[Math.max(0, Math.min(N-1, i))]];
  const latest = rateOn(N-1);
  const prev30 = rateOn(N-1-22);  // ~30 calendar days ≈ 22 trading days
  const prev5  = rateOn(N-1-5);

  const sparkRange = dates.slice(-20);
  const seriesFor = (mapper) => sparkRange.map(d => mapper(j.rates[d]));

  // DXY computed from basket
  const dxyLatest = calcDXY(latest);
  const dxy30 = calcDXY(prev30);
  const dxy5  = calcDXY(prev5);
  const dxySpark = seriesFor(r => calcDXY(r));

  // Per-currency rows. Direction convention: chg > 0 means foreign currency
  // strengthened vs USD. DXY chg > 0 means USD strengthened.
  const inverseDir = (latest, prev) => ((latest - prev) / prev) * 100;          // EUR-style ("USD per X")
  const normalDir  = (latest, prev) => -((latest - prev) / prev) * 100;          // JPY-style ("X per USD")
  const ccy = (code, kr, mode) => {
    const lat  = mode==="inverse" ? 1/latest[code] : latest[code];
    const p30  = mode==="inverse" ? 1/prev30[code] : prev30[code];
    const p5   = mode==="inverse" ? 1/prev5[code]  : prev5[code];
    const spark = mode==="inverse" ? seriesFor(r => 1/r[code]) : seriesFor(r => r[code]);
    const dir = mode==="inverse" ? inverseDir : normalDir;
    return {
      code, kr,
      level: Math.round(lat * (mode==="inverse"?10000:100)) / (mode==="inverse"?10000:100),
      chg30: Math.round(dir(lat, p30) * 100) / 100,
      chg5d: Math.round(dir(lat, p5) * 100) / 100,
      spark,
    };
  };

  const out = [
    { code:"DXY", kr:"달러지수",
      level: Math.round(dxyLatest*100)/100,
      chg30: Math.round(((dxyLatest - dxy30) / dxy30) * 10000)/100,
      chg5d: Math.round(((dxyLatest - dxy5)  / dxy5 ) * 10000)/100,
      spark: dxySpark },
    ccy("EUR","유로","inverse"),
    ccy("JPY","엔","normal"),
    ccy("CNY","위안","normal"),
    ccy("KRW","원","normal"),
    ccy("INR","루피","normal"),
    ccy("GBP","파운드","inverse"),
    ccy("AUD","호주달러","inverse"),
  ];
  return { rows: out, asOf: dates[dates.length-1] };
}

// FRED series for M2 / monetary aggregates by country
const FRED_SERIES = {
  US: { id:"M2SL",                kr:"미국 M2",  color:"cyan"   },
  EU: { id:"MABMM301EZM189S",     kr:"유로존 M3",color:"purple" },
  CN: { id:"MYAGM2CNM189N",       kr:"중국 M2",  color:"mag"    },
  JP: { id:"MYAGM2JPM189S",       kr:"일본 M2",  color:"amber"  },
  IN: { id:"MYAGM2INM189N",       kr:"인도 M2",  color:"lime"   },
};
async function fetchFREDSeries(seriesId, fredKey, limit=36){
  const url = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${encodeURIComponent(fredKey)}&file_type=json&sort_order=desc&limit=${limit}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("FRED HTTP "+r.status);
  const j = await r.json();
  if (j.error_message) throw new Error("FRED: "+j.error_message);
  // Reverse to chronological order
  return j.observations.slice().reverse().map(o => ({ date:o.date, value: parseFloat(o.value) }));
}
async function fetchM2Data(fredKey){
  const result = {};
  const errors = [];
  for (const [code, meta] of Object.entries(FRED_SERIES)){
    try {
      const obs = await fetchFREDSeries(meta.id, fredKey, 36);
      // Compute YoY % for last 24 months
      const yoy = [];
      for (let i = 12; i < obs.length; i++){
        const cur = obs[i].value, yr = obs[i-12].value;
        if (Number.isFinite(cur) && Number.isFinite(yr) && yr !== 0){
          yoy.push(Math.round((cur - yr) / yr * 10000) / 100);
        } else {
          yoy.push(null);
        }
      }
      const cleaned = yoy.filter(v => v != null);
      if (cleaned.length > 0){
        result[code] = {
          kr: meta.kr,
          color: meta.color,
          latest: Math.round(cleaned[cleaned.length-1] * 10) / 10,
          series: cleaned,
        };
      }
    } catch(e){
      errors.push(`${code}: ${e.message}`);
    }
  }
  if (Object.keys(result).length === 0) throw new Error(errors.join(" / ") || "FRED: 데이터 없음");
  return result;
}
async function fetchVIX(alphaKey){
  const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=^VIX&apikey=${encodeURIComponent(alphaKey)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error("Alpha Vantage HTTP "+r.status);
  const j = await r.json();
  if (j.Note) throw new Error("Alpha Vantage 호출 한도 초과 (분당/일별)");
  if (j["Error Message"]) throw new Error("Alpha Vantage: "+j["Error Message"]);
  const q = j["Global Quote"];
  if (!q || !q["05. price"]) throw new Error("Alpha Vantage: 빈 응답");
  return {
    value: parseFloat(q["05. price"]),
    chg: parseFloat(q["09. change"]),
    chgPct: parseFloat(String(q["10. change percent"]).replace("%","")),
  };
}

// AI-curated bundle generated daily by .github/workflows/global_flow_data.yml
// (Claude Opus 4.7 + web_search). Same-origin, served by GitHub Pages.
async function fetchAIData(){
  const url = "global_flow_data.json?t=" + Math.floor(Date.now() / (10*60*1000)); // 10-min cache buster
  const r = await fetch(url, { cache: "no-cache" });
  if (!r.ok) throw new Error("AI bundle HTTP "+r.status+" (워크플로우 첫 실행 전이거나 실패)");
  const j = await r.json();
  if (!j || typeof j !== "object") throw new Error("AI bundle: invalid JSON");
  if (!j.leaderboard || !j.etfFlows) throw new Error("AI bundle: 필수 필드 누락");
  return j;
}

function useDataFeed(){
  const [keys, setKeysState] = useState(loadKeys);
  const [feed, setFeed] = useState({
    currency: { rows: window.CURRENCY_DATA, source:"sample", error:null, asOf:null, loading:false },
    m2:       { data: window.M2_DATA,       source:"sample", error:null, asOf:null, loading:false },
    vix:      { value: 14.82, chg:-2.4,     source:"sample", error:null, asOf:null, loading:false },
    dxy:      { value: 99.84, chg:-2.84,    source:"sample", error:null, asOf:null, loading:false },
    ai:       { data: null,                 source:"sample", error:null, asOf:null, loading:false },
  });

  const setKeys = useCallback((next) => {
    saveKeys(next);
    setKeysState(next);
  }, []);

  const refresh = useCallback(async () => {
    setFeed(f => ({
      currency: {...f.currency, loading:true},
      m2:       {...f.m2,       loading:true},
      vix:      {...f.vix,      loading:true},
      dxy:      {...f.dxy,      loading:true},
      ai:       {...f.ai,       loading:true},
    }));

    // Currency + DXY (Frankfurter, no key)
    fetchCurrencyData().then(({ rows, asOf }) => {
      const dxyRow = rows.find(r => r.code === "DXY");
      setFeed(f => ({
        ...f,
        currency: { rows, source:"frankfurter", error:null, asOf, loading:false },
        dxy: dxyRow
          ? { value: dxyRow.level, chg: dxyRow.chg30, source:"frankfurter (계산)", error:null, asOf, loading:false }
          : f.dxy,
      }));
    }).catch(e => {
      setFeed(f => ({
        ...f,
        currency: {...f.currency, error: e.message, loading:false},
        dxy:      {...f.dxy,      error: e.message, loading:false},
      }));
    });

    // M2 (FRED, requires key)
    const k = loadKeys();
    if (k.fred){
      fetchM2Data(k.fred).then(data => {
        setFeed(f => ({...f, m2: { data, source:"fred", error:null, asOf:new Date().toISOString().slice(0,10), loading:false }}));
      }).catch(e => {
        setFeed(f => ({...f, m2: {...f.m2, error: e.message, loading:false}}));
      });
    } else {
      setFeed(f => ({...f, m2: {...f.m2, loading:false}}));
    }

    // VIX (Alpha Vantage, requires key)
    if (k.alpha){
      fetchVIX(k.alpha).then(d => {
        setFeed(f => ({...f, vix: { value: d.value, chg: d.chgPct, source:"alpha", error:null, asOf:new Date().toISOString(), loading:false }}));
      }).catch(e => {
        setFeed(f => ({...f, vix: {...f.vix, error: e.message, loading:false}}));
      });
    } else {
      setFeed(f => ({...f, vix: {...f.vix, loading:false}}));
    }

    // AI bundle (Claude Opus 4.7, no client key — pre-generated by GH Actions)
    fetchAIData().then(data => {
      setFeed(f => ({...f, ai: { data, source: data._model || "claude", error:null, asOf: data._generatedAt || data.asOf || null, loading:false }}));
    }).catch(e => {
      setFeed(f => ({...f, ai: {...f.ai, error: e.message, loading:false}}));
    });
  }, []);

  useEffect(() => { refresh(); /* run once on mount */ }, []);

  return { feed, keys, setKeys, refresh };
}

function KpiStrip({ periodFactor, period, onJump, feed }){
  return (
    <div style={{
      display:"flex", borderBottom:"1px solid var(--line)",
      background:"rgba(10,15,28,0.4)", backdropFilter:"blur(8px)",
    }}>
      {KPIS.map((k,i) => {
        // Scale dollar/percent values; keep DXY/VIX as-is (level metrics) and override with live data when available
        let val = k.val, chg = k.chg, up = k.up;
        if (k.en === "DXY" && feed?.dxy && feed.dxy.source !== "sample" && !feed.dxy.error){
          val = feed.dxy.value;
          chg = (feed.dxy.chg>=0?"+":"") + feed.dxy.chg.toFixed(2) + "%";
          up = feed.dxy.chg >= 0;
        } else if (k.en === "VIX" && feed?.vix && feed.vix.source !== "sample" && !feed.vix.error){
          val = feed.vix.value;
          chg = (feed.vix.chg>=0?"+":"") + feed.vix.chg.toFixed(2) + "%";
          up = feed.vix.chg >= 0;
        } else if (k.unit==="$B") val = k.val * periodFactor;
        else if (k.unit==="%")    val = k.val * (period==="1D"?0.05:period==="1W"?0.3:period==="1M"?1:period==="3M"?1.4:period==="1Y"?1.8:2.2);
        return (
          <KPI key={i} {...k} val={val} chg={chg} up={up}
            accent={`var(--accent-${k.accent})`}
            onClick={()=>k.anchor && onJump(k.anchor)}/>
        );
      })}
    </div>
  );
}

  const [playing, setPlaying] = useState(false);
  useEffect(()=>{
    if (!playing) return;
    const id = setInterval(()=>{

        const next = s + 0.005;
        if (next >= 1) { setPlaying(false); return 1; }
        return next;

    return ()=>clearInterval(id);
  }, [playing, setScrub]);
  return (
    <button onClick={()=>{ if (scrub>=1) setScrub(0); setPlaying(p=>!p); }} style={{
      padding:"5px 12px", fontSize:11, fontWeight:600,
      color: playing ? "var(--accent-cyan)" : "var(--text-1)",

  );
}

function SrcLine({ label, status, needs, needsLabel }){
  let badge = "샘플", color = "var(--text-3)", note = "";
  if (status?.loading)        { badge = "로딩…"; color = "var(--accent-amber)"; }
  else if (status?.error)     { badge = "실패"; color = "var(--down)"; note = status.error; }
  else if (status?.source && status.source !== "sample") {
    badge = "실시간"; color = "var(--up)";
    if (status.asOf) note = String(status.asOf).slice(0,10);
  }
  else if (needs)             { badge = `${needsLabel} 키 입력 필요`; }
  return (
    <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"3px 0", fontSize:10}}>
      <span style={{color:"var(--text-1)"}}>{label}</span>
      <span className="mono" title={note}
        style={{color, fontWeight:600, display:"inline-flex", alignItems:"center", gap:5}}>
        <span style={{width:5, height:5, borderRadius:3, background:color}}/>
        {badge}
      </span>
    </div>
  );
}

function SettingsDrawer({ open, onClose, period, setPeriod, heroView, setHeroView, filter, setFilter, scrub, setScrub, density, setDensity, keys, setKeys, feed, refresh }){

  return (
    <>
      <div className={"settings-backdrop"+(open?" open":"")} onClick={onClose}/>
      <aside className={"settings-drawer"+(open?" open":"")} aria-hidden={!open}>
        <div style={{

        </div>
        <div style={{flex:1, overflowY:"auto"}}>
          <ApiKeysSection keys={keys} setKeys={setKeys} feed={feed} refresh={refresh}/>
          <Section title="Hero 시각화">

              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:6}}>
                {[{v:"map",l:"세계지도"},{v:"sankey",l:"산키"},{v:"chord",l:"코드"},{v:"bubble",l:"버블"}].map(o => (

              }}>

                <option value="equities">주식</option>
                <option value="bonds">채권</option>
                <option value="gold">금</option>
                <option value="commodities">원자재</option>
              </select>
            </Group>
          </Section>

          <Section title="시간 컨트롤">
            <Group label="기간">
              <div style={{display:"flex", gap:4, padding:3, background:"rgba(120,150,210,0.06)", borderRadius:6}}>

          </Section>
        </div>
        <div style={{padding:"12px 18px", borderTop:"1px solid var(--line-strong)", fontSize:10, color:"var(--text-3)", letterSpacing:"0.1em"}} className="mono">

// ============================================================
function App(){
  const [heroView, setHeroView] = useState("map");
  const [period, setPeriod] = useState("1M");
  const [scrub, setScrub] = useState(0.78);
  const [filter, setFilter] = useState("all");
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [activeNav, setActiveNav] = useState("top");
  const [density, setDensity] = useState("regular");

  const { feed, keys, setKeys, refresh } = useDataFeed();
  const periodFactor = PERIOD_FACTOR[period] || 1;

  const onNav = (id) => {
    setActiveNav(id);
    smoothScrollTo(id);
  };

  // Track which section is in viewport for nav highlight
  useEffect(()=>{
    const sectionMap = {
      "flow-tracking":  "flow-tracking",
      "asset-rotation": "asset-rotation",
      "currency-m2":    "m2-supply",
      "reports":        "leaderboard",
    };
    const onScroll = () => {
      const y = window.scrollY + 200;
      if (y < 200) { setActiveNav("top"); return; }
      let pick = "top";
      for (const [navId, elId] of Object.entries(sectionMap)){
        const el = document.getElementById(elId);
        if (el && y >= el.offsetTop) pick = navId;
      }
      setActiveNav(pick);
    };
    window.addEventListener("scroll", onScroll, { passive:true });
    onScroll();
    return ()=>window.removeEventListener("scroll", onScroll);
  }, []);

  // Density presets
  const gap = density==="compact" ? 10 : 14;
  const padX = density==="compact" ? 16 : 24;
  const heroH = density==="compact" ? 480 : 560;

  return (
    <div style={{minHeight:"100vh"}}>
      <Header activeNav={activeNav} onNav={onNav} period={period}
        onOpenSettings={()=>setSettingsOpen(true)}
        feed={feed} onRefresh={refresh}/>
      <KpiStrip periodFactor={periodFactor} period={period} onJump={onNav} feed={feed}/>
      <TimeControls period={period} setPeriod={setPeriod} scrub={scrub} setScrub={setScrub}/>

      <div id="flow-tracking" style={{
        display:"grid",
        gridTemplateColumns:"minmax(0, 1.55fr) minmax(380px, 1fr)",
        gap, padding:`${gap}px ${padX}px ${gap}px`,
        scrollMarginTop:120,
      }}>
        <div style={{display:"flex", flexDirection:"column", gap, minWidth:0}}>
          <div style={{
            display:"flex", justifyContent:"space-between", alignItems:"center",
            padding:"4px 2px",
          }}>
            <div style={{display:"flex", alignItems:"center", gap:14}}>
              <div style={{fontSize:11, color:"var(--text-2)", letterSpacing:"0.18em", fontWeight:600}}>HERO VIEW · 시각화 모드</div>
            </div>
            <HeroSwitcher view={heroView} setView={setHeroView}/>
          </div>
          <div style={{height:heroH, minHeight:heroH}}>
            <Hero view={heroView} scrub={scrub} filter={filter} setFilter={setFilter} periodFactor={periodFactor}/>
          </div>
          <div id="currency-m2"><PanelM2 feedStatus={feed.m2} ai={feed.ai}/></div>
        </div>

        <div style={{display:"flex", flexDirection:"column", gap, minWidth:0}}>
          <PanelAssetRotation periodFactor={periodFactor} ai={feed.ai}/>
          <div id="reports"><PanelLeaderboard periodFactor={periodFactor} ai={feed.ai}/></div>
          <PanelCurrency feedStatus={feed.currency} ai={feed.ai}/>
          <PanelETF periodFactor={periodFactor} ai={feed.ai}/>
        </div>
      </div>

      <footer style={{
        padding:"14px 24px", borderTop:"1px solid var(--line)",
        display:"flex", justifyContent:"space-between",
        fontSize:10, color:"var(--text-3)", letterSpacing:"0.1em",
      }} className="mono">
        <span>© 2026 GLOBAL MONEY MOVE · MACRO RESEARCH TERMINAL</span>
        <span>DATA · BIS · IIF · IMF · ICI · BLOOMBERG · 2026.05.04</span>
        <span>v2.4.1 · 한국어</span>
      </footer>

      <button className="settings-fab" title="설정 열기" onClick={()=>setSettingsOpen(true)}>⚙</button>

      <SettingsDrawer open={settingsOpen} onClose={()=>setSettingsOpen(false)}
        period={period} setPeriod={setPeriod}
        heroView={heroView} setHeroView={setHeroView}
        filter={filter} setFilter={setFilter}
        scrub={scrub} setScrub={setScrub}
        density={density} setDensity={setDensity}
        keys={keys} setKeys={setKeys} feed={feed} refresh={refresh}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
