  return `${withSign ? sign : ''}${n.toFixed(2)}%`;
}
function fmtChange(n) {
  if (n == null) return '-';
  const sign = n > 0 ? '+' : '';
  return `${sign}${n.toLocaleString('ko-KR')}`;
}
function fmtEok(amountWon) {
  if (amountWon == null) return '-';
  const v = amountWon;
  const sign = v > 0 ? '+' : '';
  if (Math.abs(v) >= 10000) return `${sign}${(v / 10000).toFixed(2)}조`;
  return `${sign}${Math.round(v).toLocaleString('ko-KR')}억`;
}
function colorFor(n) {
  if (n > 0) return 'var(--up)';
  if (n < 0) return 'var(--down)';
  return 'var(--flat)';
}
function arrow(n) { if (n > 0) return '▲'; if (n < 0) return '▼'; return '·'; }

function nowKST() {

/* ============== Korean market hours status (real-time) ============== */
function useMarketStatus() {
  const [status, setStatus] = useState(() => computeMarketStatus());
  useEffect(() => {
    const id = setInterval(() => setStatus(computeMarketStatus()), 30000);
    return () => clearInterval(id);
  }, []);
  return status;
}
function computeMarketStatus() {
  const d = new Date();
  const kst = new Date(d.getTime() + (d.getTimezoneOffset() + 540) * 60000);
  const day = kst.getUTCDay();
  const hh = kst.getUTCHours();
  const mm = kst.getUTCMinutes();
  const minutes = hh * 60 + mm;
  if (day === 0 || day === 6) return { label: 'MARKET CLOSED', open: false, dotColor: 'var(--flat)' };
  if (minutes < 540) return { label: 'PRE-MARKET', open: false, dotColor: 'var(--accent)' };
  if (minutes >= 540 && minutes < 930) return { label: 'MARKET OPEN', open: true, dotColor: 'var(--pos-green)' };
  return { label: 'AFTER HOURS', open: false, dotColor: 'var(--flat)' };
}

/* ============== Live countdown (NEXT TICK 30s loop) ============== */
function useTickCountdown(seconds = 30) {
  const [n, setN] = useState(seconds);
  useEffect(() => {
    const id = setInterval(() => setN(prev => prev <= 1 ? seconds : prev - 1), 1000);
    return () => clearInterval(id);
  }, [seconds]);
  return n;
}

/* ============== Sparkline ============== */
function Sparkline({ data, width = 80, height = 28, color, fill = true, strokeWidth = 1.5 }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const stepX = width / (data.length - 1 || 1);
  const points = data.map((v, i) => [i * stepX, height - ((v - min) / range) * (height - 4) - 2]);
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const last = data[data.length - 1];
  const first = data[0];
  const auto = last >= first ? 'var(--up)' : 'var(--down)';
  const c = color || auto;
  const areaPath = path + ` L${width},${height} L0,${height} Z`;
  const grad = `grad-${Math.random().toString(36).slice(2, 7)}`;
  return (
    <svg width={width} height={height} style={{ overflow: 'visible' }}>
      {fill && (
        <>
          <defs>
            <linearGradient id={grad} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={c} stopOpacity="0.18" />
              <stop offset="100%" stopColor={c} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={areaPath} fill={`url(#${grad})`} />
        </>
      )}
      <path d={path} fill="none" stroke={c} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="2.5" fill={c} />
    </svg>
  );
}

/* ===================================================================
   SectorHeatmap
=================================================================== */
function SectorHeatmap({ sectors, onSelect, selectedId }) {
  sectors = sectors || [];
  const total = Math.max(1, sectors.reduce((s, x) => s + (x.weight || 0), 0));
  // 비중 데이터가 부족하면(naver 폴백) 균등 분포로 폴백
  const useEqual = sectors.every(s => !s.weight) || total <= 1;
  return (
    <div className="dash-card">
      <CardHead title="Sector Heatmap · 주도섹터" subtitle={useEqual ? '균등 분포 (시총 데이터 제한)' : '시총 비중 × 등락률'} right={<LegendInline />} live />
      <div style={{ padding: '0 14px 14px 14px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(12, 1fr)', gridAutoRows: '74px', gap: 4 }}>
          {sectors.map((s) => {
            const w = s.weight || 0;
            const span = useEqual ? Math.max(2, Math.floor(12 / sectors.length)) : Math.max(2, Math.round((w / total) * 12));
            const rowSpan = w > 12 ? 2 : 1;
            const intensity = Math.min(1, Math.abs(s.changePct) / 4);
            const isUp = s.changePct >= 0;
            const baseUp = [255, 93, 108];
            const baseDn = [77, 142, 255];
            const base = isUp ? baseUp : baseDn;
            const alpha = 0.08 + intensity * 0.55;
            const bg = `rgba(${base[0]},${base[1]},${base[2]},${alpha})`;
            const isSel = selectedId === s.id;
            const txt = intensity > 0.6 ? '#fff' : 'var(--ink)';
            return (
              <button
                key={s.id}
                onClick={() => onSelect && onSelect(s.id)}
                title={`${s.name} · ${s.theme} · 주요종목: ${s.leadStocks.join(', ')}`}
                style={{
                  gridColumn: `span ${span}`, gridRow: `span ${rowSpan}`,
                  background: bg,
                  border: isSel ? `1px solid ${isUp ? 'var(--up)' : 'var(--down)'}` : '1px solid var(--line)',
                  boxShadow: isSel ? `0 0 0 1px ${isUp ? 'var(--up)' : 'var(--down)'}, 0 0 24px ${isUp ? 'var(--up-glow)' : 'var(--down-glow)'}` : 'none',
                  borderRadius: 6, padding: '8px 10px', textAlign: 'left',
                  display: 'flex', flexDirection: 'column', justifyContent: 'space-between',
                  color: txt, transition: 'all 0.12s ease', cursor: 'pointer',
                  fontFamily: 'inherit', position: 'relative', overflow: 'hidden',
                }}
                onMouseEnter={e => { if (!isSel) e.currentTarget.style.borderColor = 'var(--line-bright)'; }}
                onMouseLeave={e => { if (!isSel) e.currentTarget.style.borderColor = 'var(--line)'; }}
              >
                <div>
                  <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: '-0.01em' }}>{s.name}</div>
                  <div style={{ fontSize: 9, opacity: 0.7, marginTop: 2, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase' }}>
                    {s.weight.toFixed(1)}% · {s.theme}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
                  <span className="tnum mono" style={{ fontSize: 16, fontWeight: 700, letterSpacing: '-0.01em' }}>
                    {fmtPct(s.changePct)}
                  </span>
                  <span className="tnum mono" style={{ fontSize: 9, opacity: 0.7, fontWeight: 600 }}>
                    {fmtEok(s.foreignNet)}
                  </span>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ===================================================================
   ProgramTrade
=================================================================== */
function ProgramTrade({ data }) {
  const p = data.programTrade || { arbBuy: 0, arbSell: 0, nonArbBuy: 0, nonArbSell: 0, netTotal: 0 };
  const max = Math.max(1, Math.abs(p.arbBuy), Math.abs(p.arbSell), Math.abs(p.nonArbBuy), Math.abs(p.nonArbSell));
  const allZero = !p.arbBuy && !p.arbSell && !p.nonArbBuy && !p.nonArbSell;
  const Bar = ({ label, v, max }) => {
    const w = (Math.abs(v) / max) * 100;
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '90px 1fr 80px', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 10, color: 'var(--ink-3)', fontWeight: 700, letterSpacing: '0.05em', textTransform: 'uppercase' }}>{label}</span>
        <div style={{ height: 14, background: 'var(--surface-2)', borderRadius: 0, position: 'relative', overflow: 'hidden', border: '1px solid var(--line)' }}>
          <div style={{
            position: 'absolute', top: 0, bottom: 0,
            left: v < 0 ? `${100 - w}%` : '50%',
            width: `${w / 2}%`,
            background: v < 0 ? 'var(--down)' : 'var(--up)',
            boxShadow: `0 0 12px ${v < 0 ? 'var(--down-glow)' : 'var(--up-glow)'}`,
          }} />
          <div style={{ position: 'absolute', top: 0, bottom: 0, left: '50%', width: 1, background: 'var(--line-bright)' }} />
        </div>
        <span className="tnum mono" style={{ fontSize: 12, fontWeight: 700, color: colorFor(v), textAlign: 'right' }}>
          {fmtChange(v)}억
        </span>
      </div>
    );
  };
  return (
    <div className="dash-card">
      <CardHead title="Program Trading · 프로그램 매매" subtitle={allZero ? 'NO DATA · KRX 자격증명 필요' : `NET ${fmtChange(p.netTotal)}억`} />
      <div style={{ padding: '0 18px 16px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        {allZero ? (
          <div style={{ padding: '24px 8px', textAlign: 'center', color: 'var(--ink-3)', fontSize: 11, lineHeight: 1.6 }}>
            프로그램 매매 데이터는 KRX 로그인이 필요합니다.<br />
            Settings(⚙) → KRX 자격증명 안내 참조.
          </div>
        ) : (
          <>
            <Bar label="ARB BUY" v={p.arbBuy} max={max} />
            <Bar label="ARB SELL" v={p.arbSell} max={max} />
            <Bar label="NON-ARB BUY" v={p.nonArbBuy} max={max} />
            <Bar label="NON-ARB SELL" v={p.nonArbSell} max={max} />
          </>
        )}
      </div>
    </div>
  );
}

function AIPanel({ data, runTrigger }) {
  const [state, setState] = useState('idle');
  const [summary, setSummary] = useState(null);
  const [error, setError] = useState(null);

  const generate = async () => {
    setState('loading');
    setError(null);
    setSummary(null);
    try {
      if (!window.claude || typeof window.claude.complete !== 'function') {
        throw new Error('CLAUDE API NOT CONNECTED');
      }
      const topSectors = [...data.sectors].sort((a, b) => b.changePct - a.changePct).slice(0, 3);
      const bottomSectors = [...data.sectors].sort((a, b) => a.changePct - b.changePct).slice(0, 2);
      const topThemes = data.themes.slice(0, 3).map(t => `${t.name}(${fmtPct(t.changePct)})`).join(', ');
      const newsBrief = data.news.slice(0, 5).map(n => `- ${n.headline}`).join('\n');

      const prompt = `당신은 한국 증시 전문 애널리스트입니다. 다음 실시간 데이터를 바탕으로 장중 시장 코멘트를 작성하세요.

[현재 ${data.asOf} 기준]
- KOSPI: ${data.kospi.value.toFixed(2)} (${fmtPct(data.kospi.changePct)})
- 외국인 순매수: ${fmtEok(data.kospi.foreignNet/1e8)}, 기관: ${fmtEok(data.kospi.instNet/1e8)}, 개인: ${fmtEok(data.kospi.indivNet/1e8)}
- 주도섹터 상위: ${topSectors.map(s => `${s.name}(${fmtPct(s.changePct)})`).join(', ')}
- 약세섹터: ${bottomSectors.map(s => `${s.name}(${fmtPct(s.changePct)})`).join(', ')}
- 핫테마: ${topThemes}
- USD/KRW: ${data.fx.usdkrw.toFixed(2)} (${fmtPct(data.fx.changePct)})
- 주요뉴스:
${newsBrief}

다음 JSON 형식으로만 답하세요. 다른 텍스트는 포함하지 마세요:
{
  "headline": "오늘 시장의 한 줄 요약 (25자 이내)",
  "tone": "bullish 또는 neutral 또는 bearish 중 하나",
  "summary": "2-3문장으로 시장 흐름 요약",
  "drivers": ["주도 요인 1", "주도 요인 2", "주도 요인 3"],
  "watchlist": [{"name":"주목 종목명","reason":"이유"}, {"name":"...","reason":"..."}, {"name":"...","reason":"..."}],
  "risks": ["리스크 요인 1", "리스크 요인 2"],
  "outlook": "오후장 전망 1-2문장"
}`;

      const text = await window.claude.complete(prompt);
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('JSON parse failed');
      const parsed = JSON.parse(m[0]);
      setSummary(parsed);
      setState('ready');
    } catch (e) {
      console.warn('[AIPanel] fallback:', e.message);
      setError(e.message);
      setSummary({
        headline: '반도체·조선 주도, 외국인 순매수 8일 연속',
        tone: 'bullish',
        summary: '코스피가 외국인의 강한 매수세와 반도체 업종의 강세에 힘입어 1% 넘게 상승하고 있습니다. HBM 관련주와 조선주가 시장을 견인하는 가운데, 2차전지 섹터는 유럽 보조금 우려로 조정을 받고 있습니다.',
        drivers: ['SK하이닉스·한미반도체 등 HBM 관련주 급등', '조선업 카타르 LNG선 수주 기대', '외국인 8거래일 연속 순매수'],
        watchlist: [
          { name: 'SK하이닉스', reason: 'HBM3E 12단 양산 모멘텀' },
          { name: 'HD현대중공업', reason: 'LNG선 대량 수주 임박설' },
          { name: '한미반도체', reason: '52주 신고가 + 외국인 매수 집중' },

        outlook: '주도섹터 중심의 차별화 장세가 이어질 전망. 외국인 매수 지속 여부가 관건.',

      setState('ready');
    }

  useEffect(() => {

            <ul style={{ margin: 0, paddingLeft: 0, listStyle: 'none', display:'flex', flexDirection:'column', gap:6 }}>
              {summary.risks?.map((r, i) => (
                <li key={i} style={{ display: 'flex', gap: 8, fontSize: 12, lineHeight: 1.5, color: 'var(--ink-2)' }}>
                  <span className="mono" style={{ color: 'var(--down)', fontWeight: 700, fontSize: 11, minWidth: 22 }}>-{String(i+1).padStart(2,'0')}</span>
                  <span>{r}</span>
                </li>
              ))}
            </ul>
          </Section>

          <Section label="OUTLOOK · 오후장 전망">
            <div style={{ fontSize: 12, lineHeight: 1.7, color: 'var(--ink-2)' }}>
              {summary.outlook}
            </div>
          </Section>

          <button onClick={generate} className="btn-ghost" style={{ width: '100%', marginTop: 8 }}>
            ↻ RE-RUN ANALYSIS

        </div>
      )}
    </div>
  );
}

function Section({ label, children }) {

/* ===================================================================
   PageHead with clickable breadcrumb
=================================================================== */
function PageHead({ title, subtitle, breadcrumb, action, onBreadcrumbHome }) {
  // breadcrumb is "대시보드 · 주도섹터" — first segment is clickable to overview
  const parts = (breadcrumb || '').split(' · ');
  return (
    <div style={{
      display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between',
      padding: '0 0 16px',
      borderBottom: '1px solid var(--line)',
      marginBottom: 14,
    }}>
      <div>
        {breadcrumb && (
          <div className="mono" style={{ fontSize: 10, fontWeight: 600, color: 'var(--ink-3)', marginBottom: 6, letterSpacing: '0.08em', textTransform: 'uppercase' }}>
            {parts.map((p, i) => (
              <span key={i}>
                {i > 0 && <span style={{ margin: '0 6px', color: 'var(--ink-4)' }}>·</span>}
                {i === 0 && onBreadcrumbHome ? (
                  <a href="#" onClick={e => { e.preventDefault(); onBreadcrumbHome(); }}
                     style={{ color: 'var(--ink-2)', cursor: 'pointer' }}
                     onMouseEnter={e => e.currentTarget.style.color = 'var(--accent-bright)'}
                     onMouseLeave={e => e.currentTarget.style.color = 'var(--ink-2)'}
                  >{p}</a>
                ) : <span>{p}</span>}
              </span>
            ))}
          </div>
        )}
        <h1 style={{ margin: 0, fontSize: 24, fontWeight: 700, letterSpacing: '-0.02em', color: 'var(--ink)' }}>
          {title}
        </h1>
        {subtitle && (
          <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 4, fontWeight: 500 }}>
            {subtitle}
          </div>
        )}
      </div>
      {action}
    </div>
  );
}

function StatCard({ label, value, delta, sub, icon }) {
  return (
    <div className="dash-card" style={{ padding: '14px 16px' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: 'var(--ink-3)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>{label}</span>
        {icon && <span style={{ color: 'var(--ink-4)' }}>{icon}</span>}
      </div>
      <div className="tnum mono" style={{ fontSize: 22, fontWeight: 700, letterSpacing: '-0.02em', marginTop: 4, color: 'var(--ink)' }}>
        {value}
      </div>
      {(delta != null || sub) && (
        <div className="tnum mono" style={{ fontSize: 10, marginTop: 2, color: delta != null ? colorFor(delta) : 'var(--ink-3)', fontWeight: 600, letterSpacing: '0.04em' }}>
          {delta != null && <>{arrow(delta)} {fmtPct(Math.abs(delta), false)} · </>}{sub}
        </div>
      )}
    </div>
  );
}

function InvestorCard({ label, net, streak, highlight }) {
  const isPos = (net || 0) >= 0;
  const hasData = net != null && net !== 0;
  return (
    <div className="dash-card" style={{
      padding: '16px 18px',
      borderColor: highlight && hasData ? (isPos ? 'var(--up-soft)' : 'var(--down-soft)') : 'var(--line)',
      background: highlight && hasData ? `linear-gradient(180deg, ${isPos ? 'var(--up-soft)' : 'var(--down-soft)'} 0%, var(--surface) 60%)` : 'var(--surface)',
    }}>
      <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--ink-3)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>{label}</div>
      <div className="tnum mono" style={{ fontSize: 24, fontWeight: 700, color: hasData ? colorFor(net) : 'var(--ink-3)', letterSpacing: '-0.02em', marginTop: 4 }}>
        {hasData ? fmtEok(net) : 'N/A'}
      </div>
      <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 2 }}>{hasData ? streak : 'KRX 자격증명 필요'}</div>
    </div>
  );
}

function RankList({ title, rows, field, positive }) {
  rows = rows || [];
  const max = Math.max(1, ...rows.map(r => Math.abs(r[field] || 0)));
  if (rows.length === 0) {
    return (
      <div className="dash-card">
        <CardHead title={title} />
        <div style={{ padding: '24px 18px', textAlign: 'center', color: 'var(--ink-3)', fontSize: 11 }}>데이터 없음</div>
      </div>
    );
  }
  return (
    <div className="dash-card">
      <CardHead title={title} />
      <div style={{ padding: '0 0 4px' }}>
        {rows.map((r, i) => {
          const w = (Math.abs(r[field]) / max) * 100;
          return (
            <StockLink key={r.code} code={r.code} name={r.name}>
              <div style={{
                padding: '8px 18px',
                borderTop: i === 0 ? '1px solid var(--line)' : '1px solid var(--line-soft)',
                display: 'grid',
                gridTemplateColumns: '24px 1fr auto auto',
                gap: 10, alignItems: 'center',
                transition: 'background 0.1s',
              }}
              onMouseEnter={e => e.currentTarget.style.background = 'var(--surface-2)'}
              onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
              >
                <span className="tnum mono" style={{ fontSize: 10, color: 'var(--ink-3)', fontWeight: 600 }}>{String(i+1).padStart(2,'0')}</span>
                <div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: 'var(--ink)' }}>{r.name}</div>
                  <div className="mono" style={{ fontSize: 10, color: 'var(--ink-3)', letterSpacing: '0.04em' }}>{r.sector}</div>
                </div>
                <div style={{ width: 70, height: 3, background: 'var(--line-soft)', overflow: 'hidden' }}>
                  <div style={{ width: `${w}%`, height: '100%', background: positive ? 'var(--up)' : 'var(--down)', boxShadow: `0 0 8px ${positive ? 'var(--up-glow)' : 'var(--down-glow)'}` }} />
                </div>
                <span className="tnum mono" style={{ fontWeight: 700, fontSize: 12, color: colorFor(r[field]), minWidth: 60, textAlign: 'right' }}>
                  {fmtChange(r[field])}억
                </span>
              </div>
            </StockLink>
          );
        })}
      </div>
    </div>
  );
}

      </div>
      <SectorHeatmap sectors={data.sectors} onSelect={setSelectedSector} selectedId={selectedSector} />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.4fr', gap: 14 }}>
        <SectorDetail sector={sector} />
        <div className="dash-card">
          <CardHead title="섹터 자금 흐름" subtitle={hasFlowData ? "외국인 + 기관 순매수 (억원)" : "KRX 자격증명 미설정 — 등락률만 표시"} />
          <div style={{ padding: '0 0 12px' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 12 }}>
              <thead>
                <tr>

                  <th style={{ textAlign: 'right', padding: '4px 18px', fontWeight: 700 }}>CHG%</th>
                  <th style={{ textAlign: 'right', padding: '4px 18px', fontWeight: 700 }}>FOREIGN</th>
                  <th style={{ textAlign: 'right', padding: '4px 18px', fontWeight: 700 }}>INST</th>
                  <th style={{ textAlign: 'right', padding: '4px 18px', fontWeight: 700 }}>TOTAL</th>
                </tr>
              </thead>
              <tbody>
                {sorted.map((s, i) => {
                  const total = s.foreignNet + s.instNet;
                  const isSel = selectedSector === s.id;
                  return (
                    <tr key={s.id}
                      onClick={() => setSelectedSector(s.id)}
                      style={{ borderTop: '1px solid var(--line-soft)', cursor: 'pointer', background: isSel ? 'var(--surface-2)' : 'transparent', transition: 'background 0.1s' }}
                      onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = 'var(--surface-2)'; }}
                      onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = 'transparent'; }}

                      <td className="tnum mono" style={{ padding: '8px 18px', textAlign: 'right', fontWeight: 700, color: colorFor(s.changePct) }}>
                        {fmtPct(s.changePct)}
                      </td>
                      <td className="tnum mono" style={{ padding: '8px 18px', textAlign: 'right', color: colorFor(s.foreignNet), fontWeight: 600 }}>
                        {fmtChange(s.foreignNet)}
                      </td>
                      <td className="tnum mono" style={{ padding: '8px 18px', textAlign: 'right', color: colorFor(s.instNet), fontWeight: 600 }}>
                        {fmtChange(s.instNet)}
                      </td>
                      <td className="tnum mono" style={{ padding: '8px 18px', textAlign: 'right', fontWeight: 800, color: colorFor(total) }}>
                        {fmtChange(total)}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  );

const SETTINGS_KEYS = {
  ANTHROPIC_KEY: 'kospi_intel_anthropic_key',
  REFRESH_INTERVAL: 'kospi_intel_refresh_min',
};

function loadSetting(key, fallback) {
  try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; }
}
function saveSetting(key, val) {
  try { if (val) localStorage.setItem(key, val); else localStorage.removeItem(key); } catch {}
}

/* Inject window.claude.complete shim if user provides Anthropic key */
function installClaudeShim(apiKey) {
  if (!apiKey) {
    if (window.claude && window.claude._isShim) delete window.claude;
    return;
  }
  window.claude = {
    _isShim: true,
    complete: async (prompt) => {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1024,
          messages: [{ role: 'user', content: prompt }],
        }),
      });
      if (!r.ok) {
        const err = await r.text();
        throw new Error(`Anthropic API ${r.status}: ${err.slice(0, 200)}`);
      }
      const j = await r.json();
      return j.content?.[0]?.text || '';
    },
  };
}

          </button>
          <div style={{ display: 'flex', gap: 8 }}>
            <button onClick={onClose} className="btn-ghost">CANCEL</button>
            <button onClick={handleSave} className="btn-run" style={{ height: 32, fontSize: 11 }}>
              {saved ? '✓ SAVED' : 'SAVE'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================
   DashboardApp — root, with keyboard shortcuts
=================================================================== */
function DashboardApp() {
  const [active, setActive] = useState('overview');
  const [data, setData] = useState(window.MARKET_DATA);
  const [dataSource, setDataSource] = useState('inline'); // 'inline' | 'live' | 'fetching'
  const [selectedSector, setSelectedSector] = useState('semi');
  const [runTrigger, setRunTrigger] = useState(0);
  const [loading, setLoading] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false);

  // Install Claude API shim from saved settings (runs once on mount)
  useEffect(() => {
    const key = loadSetting(SETTINGS_KEYS.ANTHROPIC_KEY, '');
    installClaudeShim(key);
  }, []);

  // Fetch live data from generated JSON, fall back to inline mock if unavailable
  useEffect(() => {
    let cancelled = false;
    const loadLiveData = async () => {
      setDataSource('fetching');
      try {
        const r = await fetch('dashboard_data.json?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const live = await r.json();
        if (cancelled) return;
        if (live._error) {
          console.warn('[data] live JSON has error flag:', live._error, '— using inline mock');
          setDataSource('inline');
          return;
        }
        if (!live.kospi || !live.sectors || live.sectors.length === 0) {
          console.warn('[data] live JSON incomplete — using inline mock');
          setDataSource('inline');
          return;
        }
        setData(live);
        setDataSource('live');
        console.log('[data] live JSON loaded · source=' + (live._source || 'unknown') + ' · asOf ' + live.asOf);
      } catch (e) {
        console.warn('[data] fetch failed:', e.message, '— using inline mock');
        if (!cancelled) setDataSource('inline');
      }
    };
    loadLiveData();
    const refreshMin = parseInt(loadSetting(SETTINGS_KEYS.REFRESH_INTERVAL, '5'), 10) || 5;
    const id = setInterval(loadLiveData, refreshMin * 60 * 1000);
    return () => { cancelled = true; clearInterval(id); };
  }, [settingsOpen]); // Re-run when settings close (refresh interval may have changed)

  // Safety: if active selectedSector doesn't exist in current data, pick first
  useEffect(() => {
    if (data.sectors && data.sectors.length > 0 && !data.sectors.find(s => s.id === selectedSector)) {
      setSelectedSector(data.sectors[0].id);
    }
  }, [data, selectedSector]);

  // Detect Mac for ⌘ vs Ctrl key hint
  const isMac = useMemo(() => typeof navigator !== 'undefined' && /Mac|iPhone|iPad/.test(navigator.platform), []);

  const sector = data.sectors.find(s => s.id === selectedSector);

  const onRun = useCallback(async () => {
    setLoading(true);
    setRunTrigger(t => t + 1);
    setTimeout(() => setLoading(false), 2400);
  }, []);

  const goHome = useCallback(() => setActive('overview'), []);

  // Global keyboard shortcuts: Cmd/Ctrl+1..7 to switch nav, Cmd/Ctrl+, for settings
  useEffect(() => {
    const handler = (e) => {
      const meta = isMac ? e.metaKey : e.ctrlKey;
      if (!meta) return;
      if (e.key === ',') {
        e.preventDefault();
        setSettingsOpen(true);
        return;
      }
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= NAV_ITEMS.length) {
        e.preventDefault();
        setActive(NAV_ITEMS[num - 1].id);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [isMac]);

  // Update document title with active section
  useEffect(() => {
    const item = NAV_ITEMS.find(i => i.id === active);
    document.title = `KOSPI Intel · ${item ? item.kr : '대시보드'}`;
  }, [active]);

  const ctx = { data, sector, selectedSector, setSelectedSector, runTrigger, loading, onRun, goHome, setActive };
  const PageComp = PAGES[active] || PAGES.overview;

  return (
    <div style={{
      minHeight: '100vh',
      background: 'var(--bg)',
      display: 'flex',
      fontFamily: 'var(--font)',
    }}>
      <Sidebar active={active} onChange={setActive} data={data} isMac={isMac} dataSource={dataSource} onOpenSettings={() => setSettingsOpen(true)} />
      <main style={{
        flex: 1,
        padding: '24px 28px 36px',
        minWidth: 0,
      }}>
        <PageComp ctx={ctx} />
      </main>
      <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);

</script>

</body>
</html>
