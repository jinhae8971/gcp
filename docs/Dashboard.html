<script type="text/babel" data-presets="react">
/* eslint-disable */
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============== Number formatters ============== */
function fmtPrice(n) {
  if (n == null) return '-';
  return n.toLocaleString('ko-KR');
}
function fmtPct(n, withSign = true) {
  if (n == null) return '-';
  const sign = n > 0 ? '+' : '';
  return `${withSign ? sign : ''}${n.toFixed(2)}%`;
}
function fmtChange(n) {
  if (n == null) return '-';
  const sign = n > 0 ? '+' : '';
  return `${sign}${n.toLocaleString('ko-KR')}`;
}
function fmtEok(amountWon) {
  if (amountWon == null) return '-';
  const v = amountWon;
  const sign = v > 0 ? '+' : '';
  if (Math.abs(v) >= 10000) {
    return `${sign}${(v / 10000).toFixed(2)}조`;
  }
  return `${sign}${Math.round(v).toLocaleString('ko-KR')}억`;
}
function colorFor(n) {
  if (n > 0) return 'var(--up)';
  if (n < 0) return 'var(--down)';
  return 'var(--flat)';
}
function bgFor(n) {
  if (n > 0) return 'var(--up-soft)';
  if (n < 0) return 'var(--down-soft)';
  return 'var(--bg)';
}
function arrow(n) {
  if (n > 0) return '▲';
  if (n < 0) return '▼';
  return '·';
}

function nowKST() {
  const d = new Date();
  return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

/* ============== Sparkline (SVG) ============== */
function Sparkline({ data, width = 80, height = 28, color, fill = true, strokeWidth = 1.5 }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const stepX = width / (data.length - 1 || 1);
  const points = data.map((v, i) => [i * stepX, height - ((v - min) / range) * (height - 4) - 2]);
  const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const last = data[data.length - 1];
  const first = data[0];
  const auto = last >= first ? 'var(--up)' : 'var(--down)';
  const c = color || auto;
  const areaPath = path + ` L${width},${height} L0,${height} Z`;
  const grad = `grad-${Math.random().toString(36).slice(2, 7)}`;
  return (
    <svg width={width} height={height} style={{ overflow: 'visible' }}>
      {fill && (
        <>
          <defs>
            <linearGradient id={grad} x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stopColor={c} stopOpacity="0.18" />
              <stop offset="100%" stopColor={c} stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={areaPath} fill={`url(#${grad})`} />
        </>
      )}
      <path d={path} fill="none" stroke={c} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" />
      <circle cx={points[points.length - 1][0]} cy={points[points.length - 1][1]} r="2.5" fill={c} />
    </svg>
  );
}

function LiveClock() {
  const [t, setT] = useState(nowKST());
  useEffect(() => {
    const id = setInterval(() => setT(nowKST()), 1000);
    return () => clearInterval(id);
  }, []);
  return <span className="tnum">{t}</span>;
}

function RunButton({ onClick, loading, label = '실행', loadingLabel = '분석 중...' }) {
  return (
    <button className={`btn-run ${loading ? 'loading' : ''}`} onClick={onClick} disabled={loading}>
      {loading ? (
        <>
          <Spinner />
          <span>{loadingLabel}</span>
        </>
      ) : (
        <>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 1.5v11l9-5.5L3 1.5z" fill="currentColor" />

function MacroChip({ label, value, pct, invert }) {

function SummaryStat({ label, value, sub, pct }) {

/* ===================================================================
   2) Sector Heatmap
=================================================================== */
function SectorHeatmap({ sectors, onSelect, selectedId }) {
  const total = sectors.reduce((s, x) => s + x.weight, 0);
  return (
    <div className="dash-card">
      <CardHead
        title="주도섹터 히트맵"
        subtitle="시가총액 비중 × 등락률"
        right={<LegendInline />}
        live
      />
      <div style={{ padding: '0 16px 16px 16px' }}>
        <div style={{
          display: 'grid',
          gridTemplateColumns: 'repeat(12, 1fr)',
          gridAutoRows: '70px',
          gap: 6,
        }}>
          {sectors.map((s) => {
            const span = Math.max(2, Math.round((s.weight / total) * 12));
            const rowSpan = s.weight > 12 ? 2 : 1;
            const intensity = Math.min(1, Math.abs(s.changePct) / 4);
            const isUp = s.changePct >= 0;
            const baseUp = [240, 68, 82];
            const baseDn = [49, 130, 246];
            const base = isUp ? baseUp : baseDn;
            const alpha = 0.10 + intensity * 0.85;
            const bg = `rgba(${base[0]},${base[1]},${base[2]},${alpha})`;
            const ink = intensity > 0.55 ? '#fff' : (isUp ? 'var(--up-ink)' : 'var(--down-ink)');
            const isSel = selectedId === s.id;
            return (
              <button
                key={s.id}
                onClick={() => onSelect && onSelect(s.id)}
                style={{
                  gridColumn: `span ${span}`,
                  gridRow: `span ${rowSpan}`,
                  background: bg,
                  border: isSel ? '2px solid var(--ink)' : '1px solid rgba(255,255,255,0.5)',
                  borderRadius: 12,
                  padding: '10px 12px',
                  textAlign: 'left',
                  display: 'flex',
                  flexDirection: 'column',
                  justifyContent: 'space-between',
                  color: ink,
                  transition: 'transform 0.12s ease, border 0.12s ease',
                  cursor: 'pointer',
                  fontFamily: 'inherit',
                  position: 'relative',
                }}
                onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-1px)'}
                onMouseLeave={e => e.currentTarget.style.transform = ''}
              >
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700, letterSpacing: '-0.2px' }}>{s.name}</div>
                  <div style={{ fontSize: 10, opacity: 0.85, marginTop: 1 }}>{s.theme} · 비중 {s.weight.toFixed(1)}%</div>
                </div>
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
                  <span className="tnum" style={{ fontSize: 18, fontWeight: 800 }}>
                    {fmtPct(s.changePct)}
                  </span>
                  <span className="tnum" style={{ fontSize: 10, opacity: 0.85 }}>
                    외 {fmtEok(s.foreignNet)}
                  </span>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function LegendInline() {
  return (
    <div style={{ display: 'flex', gap: 6, alignItems: 'center', fontSize: 11, color: 'var(--ink-3)' }}>

  return (
    <div className="dash-card" style={{ height: '100%' }}>

                  fontSize: 12, fontWeight: 600,
                  padding: '6px 10px', borderRadius: 8,

                {t.label}
              </button>
            ))}
          </div>
        }
      />
      <div style={{ padding: '0 8px 12px' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead>
            <tr style={{ color: 'var(--ink-3)', fontSize: 11, fontWeight: 600 }}>
              <th style={{ textAlign: 'left', padding: '6px 12px', fontWeight: 600 }}>#</th>
              <th style={{ textAlign: 'left', padding: '6px 12px', fontWeight: 600 }}>종목</th>
              <th style={{ textAlign: 'right', padding: '6px 12px', fontWeight: 600 }}>현재가</th>
              <th style={{ textAlign: 'right', padding: '6px 12px', fontWeight: 600 }}>등락률</th>
              <th style={{ textAlign: 'right', padding: '6px 12px', fontWeight: 600, width: '32%' }}>
                {tab === 'volume' ? '거래대금(억)' : '순매수(억)'}
              </th>
            </tr>
          </thead>
          <tbody>
            {active.list.map((row, i) => {
              const v = Math.abs(row.net || row.amount || 0);
              const w = (v / max) * 100;
              const isNeg = (row.net || 0) < 0;

                <tr key={row.code} style={{

                    <div style={{ fontWeight: 700 }}>{row.name}</div>

                  </td>
                  <td style={{ padding: '10px 12px', textAlign: 'right', fontWeight: 600 }} className="tnum">
                    {fmtPrice(row.price)}
                  </td>
                  <td style={{ padding: '10px 12px', textAlign: 'right', fontWeight: 700, color: colorFor(row.changePct) }} className="tnum">
                    {fmtPct(row.changePct)}
                  </td>
                  <td style={{ padding: '10px 12px', textAlign: 'right' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'flex-end' }}>

                      }}>

                          width: `${w}%`, height: '100%',
                          background: isNeg ? 'var(--down)' : 'var(--up)',
                          borderRadius: 999,
                        }} />

                      <span className="tnum" style={{

                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ===================================================================
   8) Program Trade
=================================================================== */
function ProgramTrade({ data }) {
  const p = data.programTrade;
  const max = Math.max(Math.abs(p.arbBuy), Math.abs(p.arbSell), Math.abs(p.nonArbBuy), Math.abs(p.nonArbSell));
  const Bar = ({ label, v, max }) => {
    const w = (Math.abs(v) / max) * 100;
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '70px 1fr 70px', alignItems: 'center', gap: 10 }}>
        <span style={{ fontSize: 12, color: 'var(--ink-2)', fontWeight: 600 }}>{label}</span>
        <div style={{ height: 16, background: 'var(--bg)', borderRadius: 4, position: 'relative', overflow: 'hidden' }}>
          <div style={{
            position: 'absolute', top: 0, bottom: 0,
            left: v < 0 ? `${100 - w}%` : '50%',
            width: `${w / 2}%`,
            background: v < 0 ? 'var(--down)' : 'var(--up)',
            borderRadius: 4,
          }} />
          <div style={{ position: 'absolute', top: 0, bottom: 0, left: '50%', width: 1, background: 'var(--line)' }} />
        </div>
        <span className="tnum" style={{ fontSize: 12, fontWeight: 700, color: colorFor(v), textAlign: 'right' }}>
          {fmtChange(v)}억
        </span>
      </div>
    );
  };
  return (
    <div className="dash-card">
      <CardHead title="프로그램 매매" subtitle={`전체 순매수 ${fmtChange(p.netTotal)}억`} />
      <div style={{ padding: '0 20px 18px', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <Bar label="차익 매수" v={p.arbBuy} max={max} />
        <Bar label="차익 매도" v={p.arbSell} max={max} />
        <Bar label="비차익 매수" v={p.nonArbBuy} max={max} />
        <Bar label="비차익 매도" v={p.nonArbSell} max={max} />
      </div>
    </div>
  );
}

      </div>
      {children}
    </div>
  );
}

function SkeletonLine({ w, h, radius = 4 }) {
  return (
    <div style={{
      width: w, height: h, borderRadius: radius,
      background: 'linear-gradient(90deg, var(--line-soft) 0%, var(--line) 50%, var(--line-soft) 100%)',
      backgroundSize: '200% 100%',
      animation: 'shimmer 1.4s infinite',
    }} />
  );
}

function AIIcon() {
  return (
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M8 1.5L9.5 5.5L13.5 7L9.5 8.5L8 12.5L6.5 8.5L2.5 7L6.5 5.5L8 1.5Z" fill="var(--primary)" />
      <circle cx="12.5" cy="3" r="1" fill="var(--primary)" />
      <circle cx="3" cy="12" r="0.8" fill="var(--primary)" opacity="0.6" />
    </svg>
  );
}

function AIPanel({ data, runTrigger }) {
  const [state, setState] = useState('idle');
  const [summary, setSummary] = useState(null);
  const [error, setError] = useState(null);

  const generate = async () => {
    setState('loading');
    setError(null);
    setSummary(null);
    try {
      if (!window.claude || typeof window.claude.complete !== 'function') {
        throw new Error('Claude API 미연결 — 오프라인 분석 사용');
      }
      const topSectors = [...data.sectors].sort((a, b) => b.changePct - a.changePct).slice(0, 3);
      const bottomSectors = [...data.sectors].sort((a, b) => a.changePct - b.changePct).slice(0, 2);
      const topThemes = data.themes.slice(0, 3).map(t => `${t.name}(${fmtPct(t.changePct)})`).join(', ');
      const newsBrief = data.news.slice(0, 5).map(n => `- ${n.headline}`).join('\n');

      const prompt = `당신은 한국 증시 전문 애널리스트입니다. 다음 실시간 데이터를 바탕으로 장중 시장 코멘트를 작성하세요.

[현재 ${data.asOf} 기준]
- KOSPI: ${data.kospi.value.toFixed(2)} (${fmtPct(data.kospi.changePct)})
- 외국인 순매수: ${fmtEok(data.kospi.foreignNet/1e8)}, 기관: ${fmtEok(data.kospi.instNet/1e8)}, 개인: ${fmtEok(data.kospi.indivNet/1e8)}
- 주도섹터 상위: ${topSectors.map(s => `${s.name}(${fmtPct(s.changePct)})`).join(', ')}
- 약세섹터: ${bottomSectors.map(s => `${s.name}(${fmtPct(s.changePct)})`).join(', ')}
- 핫테마: ${topThemes}
- USD/KRW: ${data.fx.usdkrw.toFixed(2)} (${fmtPct(data.fx.changePct)})
- 주요뉴스:
${newsBrief}

다음 JSON 형식으로만 답하세요. 다른 텍스트는 포함하지 마세요:
{
  "headline": "오늘 시장의 한 줄 요약 (25자 이내)",
  "tone": "bullish 또는 neutral 또는 bearish 중 하나",
  "summary": "2-3문장으로 시장 흐름 요약",
  "drivers": ["주도 요인 1", "주도 요인 2", "주도 요인 3"],
  "watchlist": [{"name":"주목 종목명","reason":"이유"}, {"name":"...","reason":"..."}, {"name":"...","reason":"..."}],
  "risks": ["리스크 요인 1", "리스크 요인 2"],
  "outlook": "오후장 전망 1-2문장"
}`;

      const text = await window.claude.complete(prompt);
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('JSON 파싱 실패');
      const parsed = JSON.parse(m[0]);
      setSummary(parsed);
      setState('ready');
    } catch (e) {
      console.warn('[AIPanel] fallback:', e.message);
      setError(e.message);
      setSummary({
        headline: '반도체·조선 주도, 외국인 순매수 8일 연속',
        tone: 'bullish',
        summary: '코스피가 외국인의 강한 매수세와 반도체 업종의 강세에 힘입어 1% 넘게 상승하고 있습니다. HBM 관련주와 조선주가 시장을 견인하는 가운데, 2차전지 섹터는 유럽 보조금 우려로 조정을 받고 있습니다.',
        drivers: ['SK하이닉스·한미반도체 등 HBM 관련주 급등', '조선업 카타르 LNG선 수주 기대', '외국인 8거래일 연속 순매수'],
        watchlist: [
          { name: 'SK하이닉스', reason: 'HBM3E 12단 양산 모멘텀' },
          { name: 'HD현대중공업', reason: 'LNG선 대량 수주 임박설' },
          { name: '한미반도체', reason: '52주 신고가 + 외국인 매수 집중' },
        ],
        risks: ['美 FOMC 매파적 기조에 따른 변동성', '2차전지 섹터의 추세적 약세 지속'],
        outlook: '주도섹터 중심의 차별화 장세가 이어질 전망. 외국인 매수 지속 여부가 관건.',
      });
      setState('ready');
    }
  };

  useEffect(() => {
    if (runTrigger > 0) generate();
  }, [runTrigger]);

  const toneColor = summary?.tone === 'bullish' ? 'var(--up)'
                  : summary?.tone === 'bearish' ? 'var(--down)' : 'var(--flat)';
  const toneBg = summary?.tone === 'bullish' ? 'var(--up-soft)'
               : summary?.tone === 'bearish' ? 'var(--down-soft)' : 'var(--bg)';
  const toneLabel = summary?.tone === 'bullish' ? '강세' : summary?.tone === 'bearish' ? '약세' : '중립';

  return (
    <div className="dash-card" style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <CardHead
        title={<span style={{ display:'flex', alignItems:'center', gap:6 }}><AIIcon /> AI 시장 코멘트</span>}
        subtitle="Claude · 실시간 분석"
      />

      {state === 'idle' && (
        <div style={{ padding: '20px 24px 32px', textAlign: 'center', color: 'var(--ink-3)' }}>
          <div style={{ fontSize: 48, marginBottom: 12 }}>📊</div>
          <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--ink-2)', marginBottom: 4 }}>
            시장 분석 대기 중
          </div>
          <div style={{ fontSize: 12, lineHeight: 1.6 }}>
            상단의 <b style={{ color: 'var(--ink)' }}>'시장 분석 실행'</b> 버튼을 눌러<br />
            AI 코멘트를 생성하세요.
          </div>
        </div>
      )}

      {state === 'loading' && (
        <div style={{ padding: '24px', display: 'flex', flexDirection: 'column', gap: 14 }}>
          <SkeletonLine w="60%" h={20} />
          <SkeletonLine w="100%" h={12} />
          <SkeletonLine w="92%" h={12} />
          <SkeletonLine w="78%" h={12} />
          <div style={{ display: 'flex', gap: 8, marginTop: 6 }}>
            <SkeletonLine w="30%" h={28} radius={8} />
            <SkeletonLine w="30%" h={28} radius={8} />
            <SkeletonLine w="30%" h={28} radius={8} />
          </div>
          <div style={{ fontSize: 12, color: 'var(--primary)', textAlign: 'center', marginTop: 8, fontWeight: 600 }}>
            <Spinner /> &nbsp; AI가 시장을 분석하고 있어요...
          </div>
        </div>
      )}

      {state === 'ready' && summary && (
        <div style={{ padding: '0 20px 20px', overflowY: 'auto', flex: 1 }}>
          <div style={{ background: toneBg, padding: '14px 16px', borderRadius: 12, marginBottom: 14 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
              <span style={{ fontSize: 10, fontWeight: 700, color: toneColor, background: 'rgba(255,255,255,0.7)', padding: '2px 8px', borderRadius: 4 }}>
                {toneLabel} 시장
              </span>
              <span className="tnum" style={{ fontSize: 11, color: 'var(--ink-3)' }}>{data.asOf}</span>
            </div>
            <div style={{ fontSize: 17, fontWeight: 800, lineHeight: 1.3, letterSpacing: '-0.3px' }}>
              {summary.headline}
            </div>
          </div>

          <div style={{ fontSize: 13, lineHeight: 1.65, color: 'var(--ink-2)', marginBottom: 18 }}>
            {summary.summary}
          </div>

          <Section label="주도 요인">
            <ul style={{ margin: 0, paddingLeft: 0, listStyle: 'none', display:'flex', flexDirection:'column', gap:6 }}>
              {summary.drivers?.map((d, i) => (
                <li key={i} style={{ display: 'flex', gap: 8, fontSize: 13, lineHeight: 1.5 }}>
                  <span style={{ color: 'var(--up)', fontWeight: 800 }}>·</span>
                  <span>{d}</span>
                </li>
              ))}
            </ul>
          </Section>

          <Section label="주목 종목">
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {summary.watchlist?.map((w, i) => (
                <div key={i} style={{ background: 'var(--bg-soft)', padding: '10px 12px', borderRadius: 10 }}>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>{w.name}</div>
                  <div style={{ fontSize: 12, color: 'var(--ink-2)', marginTop: 2, lineHeight: 1.45 }}>{w.reason}</div>
                </div>
              ))}
            </div>
          </Section>

          <Section label="리스크 요인">
            <ul style={{ margin: 0, paddingLeft: 0, listStyle: 'none', display:'flex', flexDirection:'column', gap:6 }}>
              {summary.risks?.map((r, i) => (
                <li key={i} style={{ display: 'flex', gap: 8, fontSize: 13, lineHeight: 1.5 }}>
                  <span style={{ color: 'var(--down)', fontWeight: 800 }}>·</span>
                  <span>{r}</span>
                </li>
              ))}
            </ul>
          </Section>

          <Section label="오후장 전망">
            <div style={{ fontSize: 13, lineHeight: 1.6, color: 'var(--ink-2)' }}>
              {summary.outlook}
            </div>
          </Section>

          <button onClick={generate} className="btn-ghost" style={{ width: '100%', marginTop: 14 }}>
            ↻ 다시 분석하기
          </button>
          {error && <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 8, textAlign:'center' }}>※ AI 호출 실패 — 오프라인 샘플 분석을 표시했습니다.</div>}
        </div>
      )}
    </div>
  );
}

/* ===================================================================
   10) Layout A — Pro Cockpit (메인)
=================================================================== */
function App() {
  const data = window.MARKET_DATA;
  const [selectedSector, setSelectedSector] = useState('semi');
  const [runTrigger, setRunTrigger] = useState(0);
  const [loading, setLoading] = useState(false);

  const sector = data.sectors.find(s => s.id === selectedSector);

  const onRun = useCallback(async () => {
    setLoading(true);
    setRunTrigger(t => t + 1);
    setTimeout(() => setLoading(false), 2400);
  }, []);

  return (
    <div style={{ maxWidth: 1448, margin: '0 auto', padding: 24, background: 'var(--bg)', display: 'flex', flexDirection: 'column', gap: 16 }}>
      <MarketHeader data={data} onRun={onRun} loading={loading} />
      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr 0.85fr', gap: 16 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <SectorHeatmap sectors={data.sectors} onSelect={setSelectedSector} selectedId={selectedSector} />
          <SectorDetail sector={sector} />
          <SupplyDemand data={data} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <ThemeTrends themes={data.themes} />
          <SpecialStocks data={data} />
          <ProgramTrade data={data} />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
          <AIPanel data={data} runTrigger={runTrigger} />
          <NewsList news={data.news.slice(0, 5)} />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
