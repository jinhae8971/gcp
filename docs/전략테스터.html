  <script type="text/babel">
// ============================================================
// App — Root + Nav + Theming (Modern vs Terminal)
// ============================================================

const { useState, useEffect, useMemo, useRef } = React;

const DEFAULT_CFG = {
  budget: 100000000, // 1억원
  universe: "KOSPI",
  startDate: "2018-01-02",
  endDate: "2024-12-30",
  dcaPeriod: "monthly",
  mode: "DCA",
  vaGrowth: 0.08,
  dipBuyEnabled: true,
  dipDrop: 0.05,
  dipMultiplier: 2,
  sellConditions: [
    { indicator: "RSI", op: ">", value: 72 },
    { indicator: "MACD_CROSS_DOWN" },
  ],
  sellLogic: "AND",
  sellSize: 0.4,
};

const NAV_ITEMS = [
  { id: "strategy", label: "전략 설정", icon: "⌘" },
  { id: "run", label: "실행", icon: "▶" },
  { id: "dashboard", label: "결과 대시보드", icon: "◫" },
  { id: "benchmark", label: "벤치마크 비교", icon: "≡" },
  { id: "trades", label: "거래 내역", icon: "≣" },
  { id: "risk", label: "리스크 지표", icon: "△" },
];

function App() {
  const [tweaks, setTweak] = useTweaks(window.TWEAK_DEFAULTS);

  const [view, setView] = useState("strategy");
  const [cfg, setCfg] = useState({
    ...DEFAULT_CFG,
    universe: tweaks.defaultBenchmark,
    dcaPeriod: tweaks.defaultDcaPeriod,
  });
  const [result, setResult] = useState(null);
  const [isRunning, setIsRunning] = useState(false);
  const [progress, setProgress] = useState(0);
  const [dataMeta, setDataMeta] = useState(SBTEngine.meta);

  // runBacktest 가 항상 최신 cfg 를 읽도록 (데이터 준비 후 지연 실행 포함)
  const cfgRef = useRef(cfg);
  useEffect(() => { cfgRef.current = cfg; }, [cfg]);

  // 테마 적용
  useEffect(() => {
    const root = document.documentElement;
    root.dataset.theme = tweaks.theme === "terminal" ? "terminal"
      : tweaks.darkMode ? "modern-dark" : "modern-light";
  }, [tweaks.theme, tweaks.darkMode]);

  // Tweaks의 벤치마크/주기는 cfg에도 즉시 반영
  useEffect(() => {
    setCfg((prev) => ({
      ...prev,
      universe: tweaks.defaultBenchmark,
      dcaPeriod: tweaks.defaultDcaPeriod,
    }));
  }, [tweaks.defaultBenchmark, tweaks.defaultDcaPeriod]);

  function runBacktest() {
    setIsRunning(true);
    setProgress(0);
    setView("run");
    let p = 0;
    const tick = setInterval(() => {
      p = Math.min(0.92, p + 0.04 + Math.random() * 0.05);
      setProgress(p);
    }, 60);
    setTimeout(() => {
      try {
        const c = cfgRef.current;
        const prices = SBTEngine.universe[c.universe];
        const bench = SBTEngine.universe[c.universe];
        const r = SBTEngine.runBacktest(c, prices, bench);
        clearInterval(tick);
        setProgress(1);
        setResult(r);
        setIsRunning(false);
      } catch (e) {
        clearInterval(tick);
        setIsRunning(false);
        console.error(e);
        alert("실행 오류: " + e.message);
      }
    }, 900);
  }

  // 데이터(실데이터 우선) 준비 후 초기 1회 자동 실행
  useEffect(() => {
    let alive = true;
    SBTEngine.ready.then((meta) => {
      if (!alive) return;
      setDataMeta(meta);
      if (meta && meta.start && meta.end) {
        setCfg((prev) => {
          const within = prev.startDate >= meta.start && prev.startDate <= meta.end;
          return { ...prev, startDate: within ? prev.startDate : meta.start, endDate: meta.end };
        });
      }
      setTimeout(() => { if (alive) runBacktest(); }, 60);
    });
    return () => { alive = false; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const isTerm = tweaks.theme === "terminal";

  return (
    <div className={`app ${isTerm ? "term" : "modern"}`}>
      <TopBar tweaks={tweaks} setTweak={setTweak} cfg={cfg} result={result} />
      <div className="app-body" style={{
        gridTemplateColumns: tweaks.showSidebar ? "232px 1fr" : "1fr"
      }}>
        {tweaks.showSidebar && (
          <Sidebar view={view} setView={setView} result={result} dataMeta={dataMeta} />
        )}
        <main className="main">
          {view === "strategy" && (
            <StrategyView cfg={cfg} setCfg={setCfg} onRun={runBacktest} isRunning={isRunning} dataMeta={dataMeta} />
          )}
          {view === "run" && (
            <RunView cfg={cfg} result={result} runProgress={progress}
              onRun={runBacktest} isRunning={isRunning}
              onGoToDashboard={() => setView("dashboard")} />
          )}
          {view === "dashboard" && <DashboardView result={result} cfg={cfg} />}
          {view === "benchmark" && <BenchmarkView result={result} cfg={cfg} />}
          {view === "trades" && <TradesView result={result} />}
          {view === "risk" && <RiskView result={result} cfg={cfg} />}
        </main>
      </div>
      <BottomBar result={result} cfg={cfg} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="비주얼">
          <TweakRadio
            label="테마"
            value={tweaks.theme}
            options={[
              { value: "modern", label: "모던" },
              { value: "terminal", label: "터미널" },
            ]}
            onChange={(v) => setTweak("theme", v)}
          />
          {!isTerm && (
            <TweakToggle
              label="다크 모드"
              value={tweaks.darkMode}
              onChange={(v) => setTweak("darkMode", v)}
            />
          )}
          <TweakToggle
            label="사이드바 표시"
            value={tweaks.showSidebar}
            onChange={(v) => setTweak("showSidebar", v)}
          />
        </TweakSection>
        <TweakSection label="전략 기본값">
          <TweakRadio
            label="DCA 주기"
            value={tweaks.defaultDcaPeriod}
            options={[
              { value: "weekly", label: "주" },
              { value: "monthly", label: "월" },
              { value: "quarterly", label: "분기" },
            ]}
            onChange={(v) => setTweak("defaultDcaPeriod", v)}
          />
          <TweakRadio
            label="벤치마크"
            value={tweaks.defaultBenchmark}
            options={[
              { value: "KOSPI", label: "코스피" },
              { value: "KOSPI200", label: "K200" },
              { value: "KOSDAQ", label: "코스닥" },
            ]}
            onChange={(v) => setTweak("defaultBenchmark", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

// ---------- TopBar ----------
function TopBar({ tweaks, setTweak, cfg, result }) {
  const isTerm = tweaks.theme === "terminal";
  return (
    <header className="topbar">
      <div className="brand">
        <div className="logo-mark">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M3 18 L8 10 L13 14 L21 4" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />
            <circle cx="21" cy="4" r="1.6" fill="currentColor" />
            <path d="M3 21 L21 21" stroke="currentColor" strokeWidth="1.2" opacity="0.5" />
          </svg>
        </div>
        <div className="brand-text">
          <div className="brand-name">전략테스터</div>
          <div className="brand-sub">{isTerm ? "STRAT.TESTER // KRX BACKTEST TERMINAL" : "KOSPI Backtest System · v0.9"}</div>
        </div>
      </div>

      <div className="top-meta">
        <div className="meta-cell">
          <div className="mc-label">유니버스</div>
          <div className="mc-val">{cfg.universe}</div>
        </div>
        <div className="meta-cell">
          <div className="mc-label">예산</div>
          <div className="mc-val">{fmtKRW(cfg.budget)}</div>
        </div>
        <div className="meta-cell">
          <div className="mc-label">기간</div>
          <div className="mc-val mono small">{cfg.startDate} → {cfg.endDate}</div>
        </div>
        {result && (
          <div className="meta-cell">
            <div className="mc-label">수익률</div>
            <div className={`mc-val ${result.summary.totalReturn >= 0 ? "up" : "down"}`}>
              {fmtPctSign(result.summary.totalReturn)}
            </div>
          </div>
        )}
      </div>

      <div className="top-actions">
        <div className="seg-mini">
          <button className={`sm-opt ${tweaks.theme === "modern" ? "active" : ""}`}
            onClick={() => setTweak("theme", "modern")}>모던</button>
          <button className={`sm-opt ${tweaks.theme === "terminal" ? "active" : ""}`}
            onClick={() => setTweak("theme", "terminal")}>터미널</button>
        </div>
        {!isTerm && (
          <button className="icon-btn" title="다크 모드 토글"
            onClick={() => setTweak("darkMode", !tweaks.darkMode)}>
            {tweaks.darkMode ? "☾" : "☀"}
          </button>
        )}
      </div>
    </header>
  );
}

// ---------- Sidebar ----------
function Sidebar({ view, setView, result, dataMeta }) {
  const meta = dataMeta || { source: "mock" };
  const isReal = meta.source === "real";
  const yr = (d) => (d ? String(d).slice(0, 4) : "—");
  return (
    <aside className="sidebar">
      <nav className="nav">
        {NAV_ITEMS.map((it) => (
          <button
            key={it.id}
            className={`nav-item ${view === it.id ? "active" : ""}`}
            onClick={() => setView(it.id)}
          >
            <span className="nav-icon">{it.icon}</span>
            <span className="nav-label">{it.label}</span>
            {it.id === "trades" && result && (
              <span className="nav-badge">{result.trades.length}</span>
            )}
          </button>
        ))}
      </nav>
      <div className="sidebar-footer">
        <div className="sf-line">market data</div>
        <div className="sf-line mono">{isReal ? "KRX·NAVER" : "MOCK"} · {yr(meta.start)}–{yr(meta.end)}</div>
        <div className="sf-line sf-dot">
          <span className="dot live"></span> {isReal ? "실데이터 연결됨" : "모의 데이터"}
        </div>
      </div>
    </aside>
  );
}

// ---------- BottomBar ----------
function BottomBar({ result, cfg }) {
  const now = new Date().toISOString().slice(0, 19).replace("T", " ");
  return (
    <footer className="botbar">
      <div className="bb-cell mono"><span className="dim">SESSION</span> {now} KST</div>
      <div className="bb-cell"><span className="dim">엔진</span> v0.9-mock</div>
      <div className="bb-cell"><span className="dim">유니버스</span> {cfg.universe} · 거래일 {result ? result.dates.length : "—"}</div>
      <div className="bb-spacer"></div>
      {result && (
        <>
          <div className="bb-cell"><span className="dim">α</span>
            <span className={result.summary.alpha >= 0 ? "up" : "down"}> {fmtPctSign(result.summary.alpha, 1)}</span>
          </div>
          <div className="bb-cell"><span className="dim">Sharpe</span> {fmtNum(result.summary.sharpe, 2)}</div>
          <div className="bb-cell"><span className="dim">MDD</span>
            <span className="down"> {fmtPct(result.summary.mdd, 1)}</span>
          </div>
        </>
      )}
      <div className="bb-cell bb-pulse"><span className="dot live"></span> READY</div>
    </footer>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
