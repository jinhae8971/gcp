<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전략테스터 · KOSPI Backtest System</title>
  <!-- inlined: styles.css -->
  <style>
/* ============================================================
   전략테스터 — 디자인 시스템
   두 가지 비주얼: modern (dark/light × 4 액센트) + terminal
   ============================================================ */

@import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap");

/* ---------- 토큰: 모던 다크 ---------- */
:root,
:root[data-theme="modern-dark"] {
  --bg: #0a0e1a;
  --bg-elev: #131826;
  --bg-2: #1a2030;
  --bg-3: #232a3d;
  --fg: #e6edf3;
  --fg-dim: #9ca3b3;
  --fg-muted: #6b7384;
  --border: #1f2740;
  --border-strong: #2c3556;

  --accent: #00d4aa;
  --accent-2: #00a88a;
  --accent-soft: rgba(0, 212, 170, 0.12);

  --up: #22c55e;
  --down: #ef4444;
  --warn: #f59e0b;
  --bench: #60a5fa;
  --macd-line: #a78bfa;
  --macd-sig: #f59e0b;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 0 rgba(255, 255, 255, 0.03) inset;
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4), 0 1px 0 rgba(255, 255, 255, 0.04) inset;

  --font-sans: "Manrope", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-display: "Space Grotesk", var(--font-sans);

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
}

:root[data-accent="amber"] { --accent: #f59e0b; --accent-2: #d97706; --accent-soft: rgba(245, 158, 11, 0.14); }
:root[data-accent="violet"] { --accent: #a78bfa; --accent-2: #8b5cf6; --accent-soft: rgba(167, 139, 250, 0.14); }
:root[data-accent="azure"] { --accent: #38bdf8; --accent-2: #0ea5e9; --accent-soft: rgba(56, 189, 248, 0.14); }

:root[data-theme="modern-light"] {
  --bg: #f6f7f9;
  --bg-elev: #ffffff;
  --bg-2: #fafbfc;
  --bg-3: #f0f2f6;
  --fg: #0b1220;
  --fg-dim: #4b5566;
  --fg-muted: #8a93a4;
  --border: #e3e6ec;
  --border-strong: #d0d5dd;

  --accent: #00a88a;
  --accent-2: #00866d;
  --accent-soft: rgba(0, 168, 138, 0.1);

  --up: #16a34a;
  --down: #dc2626;
  --warn: #d97706;
  --bench: #2563eb;
  --macd-line: #7c3aed;
  --macd-sig: #d97706;

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
}
:root[data-theme="modern-light"][data-accent="amber"] { --accent: #d97706; --accent-2: #b45309; --accent-soft: rgba(217,119,6,0.1); }
:root[data-theme="modern-light"][data-accent="violet"] { --accent: #7c3aed; --accent-2: #6d28d9; --accent-soft: rgba(124,58,237,0.1); }
:root[data-theme="modern-light"][data-accent="azure"] { --accent: #0284c7; --accent-2: #0369a1; --accent-soft: rgba(2,132,199,0.1); }

:root[data-theme="terminal"] {
  --bg: #050707;
  --bg-elev: #0a0e0c;
  --bg-2: #0e1311;
  --bg-3: #131a17;
  --fg: #c8f0d4;
  --fg-dim: #6a9a7a;
  --fg-muted: #4a6f5a;
  --border: #1c2820;
  --border-strong: #29402f;

  --accent: #00ff9c;
  --accent-2: #00cc7d;
  --accent-soft: rgba(0, 255, 156, 0.08);

  --up: #00ff9c;
  --down: #ff4d6d;
  --warn: #ffb000;
  --bench: #00d8ff;
  --macd-line: #ff70d4;
  --macd-sig: #ffb000;

  --shadow-sm: none;
  --shadow-md: none;
  --radius: 0;
  --radius-sm: 0;
  --radius-lg: 0;

  --font-sans: "JetBrains Mono", ui-monospace, monospace;
  --font-display: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button { font: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
#root { height: 100%; }
.mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1, "zero" 1; }
.small { font-size: 12px; }
.dim { color: var(--fg-dim); }
.up { color: var(--up); }
.down { color: var(--down); }

.app {
  display: grid;
  grid-template-rows: 56px 1fr 28px;
  height: 100vh;
  overflow: hidden;
}
.app-body {
  display: grid;
  grid-template-columns: 232px 1fr;
  overflow: hidden;
}
.main {
  overflow-y: auto;
  padding: 24px 28px 60px;
  background: var(--bg);
}
.main::-webkit-scrollbar { width: 10px; }
.main::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
.main::-webkit-scrollbar-track { background: transparent; }

.topbar {
  display: flex; align-items: center; gap: 24px;
  padding: 0 20px;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  position: relative;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 232px; }
.logo-mark {
  width: 36px; height: 36px; display: grid; place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--fg-dim); letter-spacing: 0.05em; text-transform: uppercase; font-family: var(--font-mono); }
.term .brand-name { font-size: 14px; letter-spacing: 0.02em; }
.term .brand-name::before { content: "▌ "; color: var(--accent); }

.top-meta { display: flex; gap: 0; flex: 1; }
.meta-cell {
  padding: 4px 18px;
  border-left: 1px solid var(--border);
  min-width: 0;
}
.meta-cell:last-child { border-right: 1px solid var(--border); }
.mc-label { font-size: 10px; color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--font-mono); }
.mc-val { font-size: 14px; font-weight: 600; font-family: var(--font-mono); font-feature-settings: "tnum" 1; margin-top: 2px; }
.mc-val.up { color: var(--up); }
.mc-val.down { color: var(--down); }

.top-actions { display: flex; align-items: center; gap: 12px; }
.seg-mini {
  display: inline-flex; padding: 3px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.sm-opt {
  background: transparent; border: 0; color: var(--fg-dim);
  padding: 6px 14px; font-size: 12px; font-weight: 600;
  border-radius: calc(var(--radius) - 2px);
  letter-spacing: 0.02em;
}
.sm-opt.active { background: var(--bg-elev); color: var(--fg); box-shadow: var(--shadow-sm); }
.term .sm-opt.active { background: var(--accent); color: #000; }
.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg);
  font-size: 14px;
}
.icon-btn:hover { background: var(--bg-3); border-color: var(--border-strong); }

.sidebar {
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 18px 12px 12px;
  overflow: hidden;
}
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  background: transparent; border: 0;
  color: var(--fg-dim);
  font-size: 13px; font-weight: 500;
  border-radius: var(--radius);
  text-align: left;
}
.nav-item:hover { background: var(--bg-2); color: var(--fg); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); }
.term .nav-item.active { background: var(--accent); color: #000; }
.term .nav-item::before { content: "» "; opacity: 0.4; }
.term .nav-item.active::before { opacity: 1; content: "▶ "; }
.nav-icon { font-size: 14px; width: 18px; text-align: center; opacity: 0.85; }
.nav-label { flex: 1; }
.nav-badge {
  padding: 1px 7px; font-size: 10px;
  background: var(--bg-3); color: var(--fg-dim);
  border-radius: 99px;
  font-family: var(--font-mono); font-weight: 600;
}
.nav-item.active .nav-badge { background: var(--accent); color: var(--bg); }

.sidebar-footer {
  margin-top: auto;
  padding: 14px 8px 4px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--fg-muted);
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.sf-line { padding: 2px 0; }
.sf-dot { display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-muted); display: inline-block; }
.dot.live { background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.botbar {
  display: flex; align-items: center; gap: 18px;
  padding: 0 20px;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--fg);
}
.bb-cell { display: flex; align-items: center; gap: 6px; }
.bb-cell .dim { color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
.bb-spacer { flex: 1; }

.view { display: flex; flex-direction: column; gap: 18px; max-width: 1400px; margin: 0 auto; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
.view-head h2 {
  margin: 0; font-family: var(--font-display);
  font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
}
.view-sub { margin: 4px 0 0; color: var(--fg-dim); font-size: 13px; }
.term .view-head h2 { font-size: 18px; text-transform: uppercase; letter-spacing: 0.06em; }
.term .view-head h2::before { content: "[ "; color: var(--accent); }
.term .view-head h2::after { content: " ]"; color: var(--accent); }

.grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 1080px) { .grid-2col { grid-template-columns: 1fr; } }

.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.term .card { border-color: var(--border-strong); box-shadow: none; }
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
}
.card-head h3 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
.term .card-head h3 { text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.term .card-head h3::before { content: "// "; opacity: 0.5; }
.card-body { padding: 18px 20px; }
.card-dense .card-body { padding: 12px 16px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 720px) { .form-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--fg-dim); letter-spacing: 0.02em; }
.field-hint { font-size: 11px; color: var(--fg-muted); font-family: var(--font-mono); }
.term .field-label { text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }

input[type="number"], input[type="date"], input[type="text"], select {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 9px 11px;
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
input:focus { border-color: var(--accent); }
.input-group {
  display: flex; align-items: stretch;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-2);
  overflow: hidden;
}
.input-group input {
  flex: 1; border: 0; background: transparent; padding: 9px 11px;
}
.input-suffix {
  display: grid; place-items: center;
  padding: 0 12px;
  font-size: 12px; color: var(--fg-dim);
  background: var(--bg-3);
  border-left: 1px solid var(--border);
  white-space: nowrap;
}
.input-group.small input { padding: 6px 9px; font-size: 12px; width: 70px; }

.quick-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chip {
  padding: 5px 10px;
  background: var(--bg-2); border: 1px solid var(--border);
  color: var(--fg-dim); font-size: 11px;
  border-radius: 99px; font-family: var(--font-mono);
}
.chip:hover { background: var(--bg-3); color: var(--fg); border-color: var(--border-strong); }
.chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.term .chip { border-radius: 0; }

.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { width: 36px; height: 20px; appearance: none; background: var(--bg-3); border-radius: 99px; position: relative; cursor: pointer; transition: background 0.15s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: var(--fg-dim); border-radius: 50%; transition: 0.2s; }
.toggle input:checked { background: var(--accent-soft); }
.toggle input:checked::after { background: var(--accent); transform: translateX(16px); }
.term .toggle input, .term .toggle input::after { border-radius: 0; }

.slider-row { display: flex; align-items: center; gap: 12px; }
.slider-row input[type="range"] { flex: 1; accent-color: var(--accent); }
.slider-val { min-width: 48px; text-align: right; font-family: var(--font-mono); font-weight: 600; color: var(--accent); }

.seg {
  display: inline-flex; padding: 3px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.seg-opt {
  background: transparent; border: 0; color: var(--fg-dim);
  padding: 6px 12px; font-size: 12px; font-weight: 500;
  border-radius: calc(var(--radius) - 2px);
  white-space: nowrap;
}
.seg-opt.active { background: var(--bg-elev); color: var(--fg); box-shadow: var(--shadow-sm); font-weight: 600; }
.term .seg-opt.active { background: var(--accent); color: #000; }

.btn {
  padding: 9px 16px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg-2);
  color: var(--fg);
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.01em;
  transition: 0.15s;
}
.btn:hover { background: var(--bg-3); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-2); }
.btn-ghost { background: transparent; }
.btn-icon {
  width: 28px; height: 28px; padding: 0;
  display: grid; place-items: center;
  background: transparent; border: 0;
  color: var(--fg-dim);
  border-radius: var(--radius-sm);
}
.btn-icon:hover { background: var(--bg-3); color: var(--down); }

.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.kpi-grid-4 { grid-template-columns: repeat(4, 1fr); }
.kpi-row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } .kpi-grid-4 { grid-template-columns: repeat(2, 1fr); } }

.kpi {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 4px;
  position: relative;
  overflow: hidden;
}
.kpi-label {
  font-size: 11px; color: var(--fg-dim);
  letter-spacing: 0.04em; text-transform: uppercase;
  font-family: var(--font-mono);
}
.kpi-value {
  font-family: var(--font-mono);
  font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
  font-feature-settings: "tnum" 1;
}
.kpi-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kpi-sub { font-size: 11px; color: var(--fg-dim); font-family: var(--font-mono); }
.kpi.tone-up .kpi-value { color: var(--up); }
.kpi.tone-down .kpi-value { color: var(--down); }
.kpi::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: transparent;
}
.kpi.tone-up::before { background: var(--up); }
.kpi.tone-down::before { background: var(--down); }
.term .kpi { border-radius: 0; }
.term .kpi::before { width: 2px; }

.chart-wrap { position: relative; }
.grid-line { stroke: var(--border); stroke-width: 1; }
.grid-baseline { stroke: var(--border-strong); stroke-width: 1; stroke-dasharray: 2 3; }
.axis-label { fill: var(--fg-muted); font-size: 10px; font-family: var(--font-mono); }
.hover-line { stroke: var(--fg-muted); stroke-width: 1; stroke-dasharray: 2 3; }

.chart-tooltip {
  position: absolute;
  background: var(--bg-elev);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 8px 10px;
  font-size: 11px;
  font-family: var(--font-mono);
  box-shadow: var(--shadow-md);
  pointer-events: none;
  min-width: 180px;
  z-index: 10;
}
.t-date { font-weight: 700; padding-bottom: 4px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.t-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.t-dot { width: 8px; height: 8px; border-radius: 2px; }
.t-name { flex: 1; color: var(--fg-dim); font-size: 10px; }
.t-val { font-weight: 700; font-feature-settings: "tnum" 1; }

.chart-legend {
  display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px;
  padding: 8px 4px 0;
  font-size: 11px; color: var(--fg-dim); font-family: var(--font-mono);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-item .dot { width: 10px; height: 2px; border-radius: 0; }

.sparkline { display: block; }

.conditions { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
.cond {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px 8px 12px;
}
.cond-idx {
  width: 22px; height: 22px;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  border-radius: 50%;
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
.term .cond-idx { border-radius: 0; }
.cond-name { font-size: 13px; font-weight: 500; }
.cond-spacer { flex: 1; }
.empty-note { padding: 18px; color: var(--fg-muted); text-align: center; font-size: 12px; border: 1px dashed var(--border); border-radius: var(--radius); }

.add-cond { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--border); }
.add-cond-label { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }
.builder-action { display: flex; align-items: center; gap: 10px; }
.logic-label { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); }

.sell-size-row { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border); }

.summary-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  padding: 5px 11px;
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 99px;
  font-size: 11px; font-family: var(--font-mono);
  color: var(--fg-dim);
}
.pill-accent { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.pill-warn { background: rgba(245, 158, 11, 0.12); color: var(--warn); border-color: var(--warn); }
.term .pill { border-radius: 0; }

.run-panel { display: grid; grid-template-columns: 1fr; gap: 18px; }
.run-progress { display: flex; flex-direction: column; gap: 6px; }
.rp-track { height: 8px; background: var(--bg-3); border-radius: 99px; overflow: hidden; position: relative; }
.term .rp-track { border-radius: 0; }
.rp-fill {

  <script>
// ============================================================
// 전략테스터 — 백테스트 엔진
// Mock OHLC 데이터 + 지표(SMA/EMA/RSI/MACD) + 시뮬레이터(DCA/VA)
// 모든 함수는 window에 노출됨
// ============================================================

(function () {
  // ---------- PRNG ----------
  function mulberry32(seed) {
    return function () {
      let t = (seed += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function gaussian(rng) {
    let u = 0, v = 0;
    while (u === 0) u = rng();
    while (v === 0) v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  // ---------- 모의 지수 데이터 생성 ----------
  // 2014-01-02 ~ 2024-12-30 거래일 기준 (약 2,700일)
  function generateIndex(opts) {
    const {
      start, end, startPrice, driftAnnual, volAnnual, seed,
      events = [], // [{date, days, totalReturn}]
    } = opts;
    const days = [];
    const d = new Date(start);
    const endD = new Date(end);
    while (d <= endD) {
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6) days.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    const rng = mulberry32(seed);
    const baseDailyVol = volAnnual / Math.sqrt(252);
    const dailyDrift = driftAnnual / 252 - 0.5 * baseDailyVol * baseDailyVol;

    const eventMap = new Map();
    for (const ev of events) {
      const evStart = new Date(ev.date);
      const dailyExcess = Math.log(1 + ev.totalReturn) / ev.days;
      for (let i = 0; i < ev.days; i++) {
        const dt = new Date(evStart);
        dt.setDate(dt.getDate() + i);
        const key = dt.toISOString().slice(0, 10);
        eventMap.set(key, (eventMap.get(key) || 0) + dailyExcess);
      }
    }

    const out = [];
    let price = startPrice;
    let vol = baseDailyVol;
    for (const day of days) {
      const eps = gaussian(rng);
      const key = day.toISOString().slice(0, 10);
      const adj = eventMap.get(key) || 0;
      const ret = dailyDrift + vol * eps + adj;
      // 변동성 클러스터링 (GARCH-ish)
      vol = 0.93 * vol + 0.05 * baseDailyVol + 0.04 * Math.abs(ret);
      vol = Math.min(vol, baseDailyVol * 3);
      const newPrice = Math.max(price * Math.exp(ret), 1);
      const open = price * (1 + (rng() - 0.5) * 0.003);
      const hi = Math.max(price, newPrice) * (1 + rng() * 0.006);
      const lo = Math.min(price, newPrice) * (1 - rng() * 0.006);
      out.push({
        date: key,
        open, high: hi, low: lo, close: newPrice,
        volume: Math.floor(rng() * 400e6 + 200e6),
      });
      price = newPrice;
    }
    return out;
  }

  // 코스피·코스피200·코스닥 시리즈
  function buildUniverse() {
    const start = "2014-01-02", end = "2024-12-30";
    const commonEvents = [
      // COVID-19 폭락 (2020 Feb-Mar)
      { date: "2020-02-20", days: 22, totalReturn: -0.32 },
      // 2020-2021 반등
      { date: "2020-04-01", days: 200, totalReturn: 0.7 },
      // 2022 약세장
      { date: "2022-01-15", days: 200, totalReturn: -0.28 },
      // 2023 반등
      { date: "2023-01-10", days: 90, totalReturn: 0.18 },
      // 2024 하반기 조정
      { date: "2024-08-01", days: 30, totalReturn: -0.12 },
    ];
    return {
      KOSPI: generateIndex({
        start, end, startPrice: 1980, driftAnnual: 0.045, volAnnual: 0.16, seed: 11,
        events: commonEvents,
      }),
      KOSPI200: generateIndex({
        start, end, startPrice: 263, driftAnnual: 0.05, volAnnual: 0.17, seed: 23,
        events: commonEvents,
      }),
      KOSDAQ: generateIndex({
        start, end, startPrice: 500, driftAnnual: 0.06, volAnnual: 0.26, seed: 41,
        events: [
          ...commonEvents,
          { date: "2021-06-01", days: 60, totalReturn: 0.22 },
          { date: "2022-07-01", days: 90, totalReturn: -0.18 },
        ],
      }),
    };
  }

  // ---------- 지표 ----------
  function sma(values, p) {
    const out = new Array(values.length).fill(null);
    let s = 0;
    for (let i = 0; i < values.length; i++) {
      s += values[i];
      if (i >= p) s -= values[i - p];
      if (i >= p - 1) out[i] = s / p;
    }
    return out;
  }
  function ema(values, p) {
    const out = new Array(values.length).fill(null);
    const k = 2 / (p + 1);
    let prev = null;
    for (let i = 0; i < values.length; i++) {
      if (i < p - 1) continue;
      if (i === p - 1) {
        let s = 0;
        for (let j = 0; j < p; j++) s += values[j];
        prev = s / p;
      } else {
        prev = values[i] * k + prev * (1 - k);
      }
      out[i] = prev;
    }
    return out;
  }
  function rsi(closes, p = 14) {
    const out = new Array(closes.length).fill(null);
    if (closes.length < p + 1) return out;
    let g = 0, l = 0;
    for (let i = 1; i <= p; i++) {
      const d = closes[i] - closes[i - 1];
      if (d > 0) g += d; else l -= d;
    }
    let aG = g / p, aL = l / p;
    out[p] = aL === 0 ? 100 : 100 - 100 / (1 + aG / aL);
    for (let i = p + 1; i < closes.length; i++) {
      const d = closes[i] - closes[i - 1];
      const gg = d > 0 ? d : 0, ll = d < 0 ? -d : 0;
      aG = (aG * (p - 1) + gg) / p;
      aL = (aL * (p - 1) + ll) / p;
      out[i] = aL === 0 ? 100 : 100 - 100 / (1 + aG / aL);
    }
    return out;
  }
  function macd(closes, fast = 12, slow = 26, signal = 9) {
    const ef = ema(closes, fast);
    const es = ema(closes, slow);
    const line = closes.map((_, i) =>
      ef[i] != null && es[i] != null ? ef[i] - es[i] : null
    );
    const sig = new Array(closes.length).fill(null);
    const first = line.findIndex((v) => v != null);
    if (first >= 0) {
      const valid = line.slice(first).filter((v) => v != null);
      const se = ema(valid, signal);
      for (let i = 0; i < se.length; i++) sig[first + i] = se[i];
    }
    const hist = closes.map((_, i) =>
      line[i] != null && sig[i] != null ? line[i] - sig[i] : null
    );
    return { line, signal: sig, hist };
  }
  function drawdown(eq) {
    let peak = -Infinity;
    return eq.map((v) => {
      if (v > peak) peak = v;
      return peak > 0 ? (v - peak) / peak : 0;
    });
  }

  // ---------- 시뮬레이터 ----------
  // config:
  // {
  //   budget, startDate, endDate,
  //   dcaPeriod: 'weekly'|'monthly'|'quarterly',
  //   mode: 'DCA'|'VA',
  //   vaGrowth: 0.07,
  //   sellConditions: [{indicator, op, value, ...}],
  //   sellLogic: 'AND'|'OR',
  //   sellSize: 0..1,
  //   dipBuyEnabled, dipDrop, dipMultiplier
  // }
  function runBacktest(cfg, prices, benchPrices) {
    const data = prices.filter((p) => p.date >= cfg.startDate && p.date <= cfg.endDate);
    if (data.length < 30) throw new Error("기간이 너무 짧습니다.");
    const closes = data.map((p) => p.close);
    const rsiArr = rsi(closes, 14);
    const m = macd(closes, 12, 26, 9);
    const sma20 = sma(closes, 20);
    const sma60 = sma(closes, 60);

    // 매수 일정
    const buys = [];
    let lastMo = -1, lastWk = -1, lastQt = -1;
    for (let i = 0; i < data.length; i++) {
      const d = new Date(data[i].date);
      const mo = d.getFullYear() * 12 + d.getMonth();
      const qt = d.getFullYear() * 4 + Math.floor(d.getMonth() / 3);
      const wk =
        d.getFullYear() * 53 +
        Math.floor((d - new Date(d.getFullYear(), 0, 1)) / (7 * 86400000));
      let pick = false;
      if (cfg.dcaPeriod === "monthly" && mo !== lastMo) { pick = true; lastMo = mo; }
      else if (cfg.dcaPeriod === "weekly" && wk !== lastWk) { pick = true; lastWk = wk; }
      else if (cfg.dcaPeriod === "quarterly" && qt !== lastQt) { pick = true; lastQt = qt; }
      if (pick) buys.push(i);
    }
    const numBuys = buys.length;
    const perBuy = cfg.budget / numBuys;
    const buySet = new Set(buys);

    let shares = 0;
    let cashReserve = 0;
    let totalDeposited = 0;
    let totalInvestedAtCost = 0; // 매수 누계 (실현손익 계산용)
    let realizedPnL = 0;
    const trades = [];
    const equity = [];
    const invested = [];
    const cashSeries = [];

    for (let i = 0; i < data.length; i++) {
      const px = data[i].close;

      // === DCA / VA 정기 매수 ===
      if (buySet.has(i)) {
        let amount = perBuy;
        if (cfg.mode === "VA") {
          const k = buys.indexOf(i) + 1;
          const periodsPerYear =
            cfg.dcaPeriod === "monthly" ? 12 :
            cfg.dcaPeriod === "weekly" ? 52 : 4;
          const t = k / periodsPerYear;
          const principal = perBuy * k;
          const target = principal * Math.pow(1 + (cfg.vaGrowth ?? 0.07), t);
          const current = shares * px + cashReserve;
          amount = Math.max(0, target - current);
          // 한도: 잔여예산 + 적립금 × 3
          const remaining = cfg.budget - totalDeposited;
          amount = Math.min(amount, remaining + perBuy * 3);
        }
        if (amount > 0) {
          // 예비 현금 우선 사용
          const useCash = Math.min(cashReserve, amount);
          cashReserve -= useCash;
          const fresh = amount - useCash;
          totalDeposited += fresh;
          const sh = amount / px;
          shares += sh;
          totalInvestedAtCost += amount;
          trades.push({
            date: data[i].date, idx: i, type: "BUY",
            reason: cfg.mode === "VA" ? "VA 정기" : "DCA 정기",
            price: px, amount, shares: sh,
          });
        }
      }

      // === 하락시 추가매수 (Dip-buy) ===
      if (cfg.dipBuyEnabled && i > 20 && totalDeposited < cfg.budget * 1.2) {
        const sma20v = sma20[i];
        if (sma20v != null && px < sma20v * (1 - cfg.dipDrop)) {
          const last = trades[trades.length - 1];
          // 최소 5거래일 간격
          if (!last || i - last.idx > 5) {
            const amt = perBuy * (cfg.dipMultiplier ?? 1.5);
            const useCash = Math.min(cashReserve, amt);
            cashReserve -= useCash;
            totalDeposited += amt - useCash;
            const sh = amt / px;
            shares += sh;
            totalInvestedAtCost += amt;
            trades.push({
              date: data[i].date, idx: i, type: "BUY",
              reason: "하락시 추가매수",
              price: px, amount: amt, shares: sh,
            });
          }
        }
      }

      // === 매도 조건 ===
      if (i > 30 && cfg.sellConditions.length > 0 && shares > 0.0001) {
        const evals = cfg.sellConditions.map((c) => evalCondition(c, i, { rsi: rsiArr, macd: m, closes, sma20, sma60 }));
        const triggered =
          cfg.sellLogic === "AND" ? evals.every(Boolean) : evals.some(Boolean);
        if (triggered) {
          const sh = shares * (cfg.sellSize ?? 0.5);
          const proceeds = sh * px;
          // 비례 원가 차감
          const costPerShare = shares > 0 ? totalInvestedAtCost / shares : 0;
          const costOut = costPerShare * sh;
          realizedPnL += proceeds - costOut;
          totalInvestedAtCost -= costOut;
          shares -= sh;
          cashReserve += proceeds;
          trades.push({
            date: data[i].date, idx: i, type: "SELL",
            reason: describeSellReasons(cfg.sellConditions, cfg.sellLogic),
            price: px, amount: proceeds, shares: sh,
            pnl: proceeds - costOut,
          });
        }
      }

      equity.push(shares * px + cashReserve);
      invested.push(totalDeposited);
      cashSeries.push(cashReserve);
    }

    const dd = drawdown(equity);
    const mdd = Math.min(...dd);

    // 일별 수익률 (포트폴리오 가치 기준; 자본투입일은 보정)
    const dailyRets = [];
    for (let i = 1; i < equity.length; i++) {
      const depDelta = invested[i] - invested[i - 1];
      const baseline = equity[i - 1] + depDelta;
      if (baseline > 0) dailyRets.push(equity[i] / baseline - 1);
    }
    const mean = dailyRets.reduce((a, b) => a + b, 0) / Math.max(dailyRets.length, 1);
    const variance =
      dailyRets.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(dailyRets.length, 1);
    const std = Math.sqrt(variance);
    const rf = 0.03 / 252;
    const sharpe = std > 0 ? ((mean - rf) / std) * Math.sqrt(252) : 0;
    const downsideRets = dailyRets.filter((r) => r < 0);
    const downStd = downsideRets.length
      ? Math.sqrt(downsideRets.reduce((a, b) => a + b * b, 0) / downsideRets.length)
      : 0;
    const sortino = downStd > 0 ? ((mean - rf) / downStd) * Math.sqrt(252) : 0;
    const annVol = std * Math.sqrt(252);
    const years = data.length / 252;
    const finalEq = equity[equity.length - 1];
    const cagr =
      totalDeposited > 0
        ? Math.pow(finalEq / totalDeposited, 1 / Math.max(years, 0.1)) - 1
        : 0;
    const calmar = mdd < 0 ? cagr / -mdd : 0;
    const totalReturn = totalDeposited > 0 ? finalEq / totalDeposited - 1 : 0;

    // 벤치마크: 동일 DCA 적용, 매도 없음
    const bench = benchPrices.filter(
      (p) => p.date >= cfg.startDate && p.date <= cfg.endDate
    );
    const benchAligned = alignByDate(bench, data);
    const benchEquity = [];
    const benchInvested = [];
    let benchShares = 0, benchDep = 0;
    for (let i = 0; i < data.length; i++) {
      if (buySet.has(i)) {
        benchShares += perBuy / benchAligned[i];
        benchDep += perBuy;
      }
      benchEquity.push(benchShares * benchAligned[i]);
      benchInvested.push(benchDep);
    }
    const benchFinal = benchEquity[benchEquity.length - 1];
    const benchTotalRet = benchDep > 0 ? benchFinal / benchDep - 1 : 0;
    const benchDd = drawdown(benchEquity);
    const benchMdd = Math.min(...benchDd);

    // 일시매수 벤치 (Lump-sum at t=0)
    const lumpShares = cfg.budget / benchAligned[0];
    const benchLump = data.map((_, i) => lumpShares * benchAligned[i]);

    // 월별 수익률
    const monthly = [];
    const byMonth = {};
    for (let i = 0; i < data.length; i++) {
      const ym = data[i].date.slice(0, 7);
      if (!byMonth[ym]) byMonth[ym] = { first: i, last: i };
      else byMonth[ym].last = i;
    }
    const monthKeys = Object.keys(byMonth).sort();
    let prevEq = null;
    for (const ym of monthKeys) {
      const { last } = byMonth[ym];
      const curEq = equity[last];
      const ret =
        prevEq != null && prevEq > 0 ? curEq / prevEq - 1 : 0;
      monthly.push({ month: ym, ret, equity: curEq });
      prevEq = curEq;
    }

    return {
      config: cfg,
      dates: data.map((p) => p.date),
      closes,
      rsi: rsiArr,
      macd: m,
      sma20, sma60,
      equity, invested, cashSeries,
      benchEquity, benchInvested, benchLump,
      benchPrices: benchAligned,
      drawdown: dd,
      benchDrawdown: benchDd,
      trades,
      monthly,
      summary: {
        totalDeposited, finalEquity: finalEq,
        realizedPnL, unrealizedPnL: finalEq - totalDeposited - realizedPnL,
        cashReserve, sharesHeld: shares,
        totalReturn, cagr, mdd, sharpe, sortino,
        annVol, calmar,
        buyCount: trades.filter((t) => t.type === "BUY").length,
        sellCount: trades.filter((t) => t.type === "SELL").length,
        winRate: winRate(trades),
        benchTotalRet, benchMdd, benchFinal,
        alpha: totalReturn - benchTotalRet,
      },
    };
  }

  function alignByDate(bench, base) {
    const map = new Map(bench.map((p) => [p.date, p.close]));
    let last = bench[0]?.close ?? 1;
    return base.map((b) => {
      const v = map.get(b.date);
      if (v != null) { last = v; return v; }
      return last;
    });
  }

  function evalCondition(c, i, ctx) {
    if (c.indicator === "RSI") {
      const v = ctx.rsi[i];
      if (v == null) return false;
      if (c.op === ">") return v > c.value;
      if (c.op === "<") return v < c.value;
    }
    if (c.indicator === "MACD_CROSS_DOWN") {
      const cur = ctx.macd.hist[i], prev = ctx.macd.hist[i - 1];
      return cur != null && prev != null && prev > 0 && cur <= 0;
    }
    if (c.indicator === "MACD_CROSS_UP") {
      const cur = ctx.macd.hist[i], prev = ctx.macd.hist[i - 1];
      return cur != null && prev != null && prev < 0 && cur >= 0;
    }
    if (c.indicator === "PRICE_VS_SMA20") {
      const v = ctx.sma20[i]; if (v == null) return false;
      return c.op === ">" ? ctx.closes[i] > v : ctx.closes[i] < v;
    }
    if (c.indicator === "PRICE_VS_SMA60") {
      const v = ctx.sma60[i]; if (v == null) return false;
      return c.op === ">" ? ctx.closes[i] > v : ctx.closes[i] < v;
    }
    return false;
  }
  function describeSellReasons(conds, logic) {
    const names = conds.map((c) => {
      if (c.indicator === "RSI") return `RSI ${c.op} ${c.value}`;
      if (c.indicator === "MACD_CROSS_DOWN") return "MACD ↓";
      if (c.indicator === "MACD_CROSS_UP") return "MACD ↑";
      if (c.indicator === "PRICE_VS_SMA20") return `종가 ${c.op} SMA20`;
      if (c.indicator === "PRICE_VS_SMA60") return `종가 ${c.op} SMA60`;
      return c.indicator;
    });
    return names.join(` ${logic} `);
  }
  function winRate(trades) {
    const sells = trades.filter((t) => t.type === "SELL");
    if (!sells.length) return 0;
    return sells.filter((s) => s.pnl > 0).length / sells.length;
  }

  // ---------- 노출 ----------
  function rangeOf(uni) {
    let start = null, end = null;
    for (const k of Object.keys(uni)) {
      const arr = uni[k];
      if (arr && arr.length) {
        if (start === null || arr[0].date < start) start = arr[0].date;
        if (end === null || arr[arr.length - 1].date > end) end = arr[arr.length - 1].date;
      }
    }
    return { start, end };
  }

  const mockUniverse = buildUniverse();
  const SBT = {
    universe: mockUniverse,
    runBacktest,
    indicators: { sma, ema, rsi, macd, drawdown },
    meta: Object.assign({ source: "mock" }, rangeOf(mockUniverse)),
  };

  // 실데이터(strategy_tester_data.json)가 있으면 모의 데이터를 대체.
  // 없거나 실패하면 조용히 모의 데이터를 유지한다 (레포의 폴백 관례).
  SBT.ready = (async function loadReal() {
    try {
      const res = await fetch("strategy_tester_data.json");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const real = {};
      for (const code of ["KOSPI", "KOSPI200", "KOSDAQ"]) {
        if (!Array.isArray(data[code]) || data[code].length < 100) {
          throw new Error("불완전한 시리즈: " + code);
        }
        real[code] = data[code];
      }
      SBT.universe = real;
      SBT.meta = Object.assign(
        {}, data.meta || {},
        { source: "real", provider: (data.meta && data.meta.source) || "file" },
        rangeOf(real)
      );
    } catch (e) {
      console.warn("[SBTEngine] 실데이터 미사용 → 모의 데이터:", e.message);
    }
    return SBT.meta;
  })();

  window.SBTEngine = SBT;
})();
  </script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});
  </script>
  <!-- inlined: charts.jsx -->
  <script type="text/babel">
// ============================================================
// 차트 컴포넌트 (SVG 기반, 외부 라이브러리 없음)
// ============================================================

const { useMemo, useState, useRef, useEffect, useCallback } = React;

// ---------- 유틸 ----------
function fmtKRW(v, compact = true) {
  if (v == null || !isFinite(v)) return "—";
  const abs = Math.abs(v);
  if (compact) {
    if (abs >= 1e8) return `₩${(v / 1e8).toFixed(2)}억`;
    if (abs >= 1e4) return `₩${(v / 1e4).toFixed(0)}만`;
    return `₩${Math.round(v).toLocaleString("ko-KR")}`;
  }
  return `₩${Math.round(v).toLocaleString("ko-KR")}`;
}
function fmtPct(v, digits = 2) {
  if (v == null || !isFinite(v)) return "—";
  return `${(v * 100).toFixed(digits)}%`;
}
function fmtPctSign(v, digits = 2) {
  if (v == null || !isFinite(v)) return "—";
  const s = v >= 0 ? "+" : "";
  return `${s}${(v * 100).toFixed(digits)}%`;
}
function fmtNum(v, digits = 2) {
  if (v == null || !isFinite(v)) return "—";
  return v.toFixed(digits);
}

// ---------- 라인 차트 (수익률 비교) ----------
function LineChart({
  series, dates, height = 320, margin = { l: 56, r: 16, t: 16, b: 28 },
  yFormat = (v) => fmtPctSign(v),
  yScale = "pct", // 'pct' | 'krw' | 'raw'
  baseline = 0,
  showLegend = true,
}) {
  const containerRef = useRef(null);
  const [width, setWidth] = useState(800);
  const [hoverX, setHoverX] = useState(null);

  useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver(([e]) => setWidth(e.contentRect.width));
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);

  const W = width, H = height;
  const innerW = W - margin.l - margin.r;
  const innerH = H - margin.t - margin.b;

  const allValues = series.flatMap((s) => s.values.filter((v) => v != null && isFinite(v)));
  const minY = Math.min(...allValues, baseline);
  const maxY = Math.max(...allValues, baseline);
  const padY = (maxY - minY) * 0.08 || 1;
  const yMin = minY - padY, yMax = maxY + padY;
  const xN = dates.length - 1;

  const xScale = (i) => margin.l + (i / Math.max(xN, 1)) * innerW;
  const yScaleFn = (v) => margin.t + (1 - (v - yMin) / (yMax - yMin)) * innerH;

  const path = (vals) => {
    let d = "", started = false;
    for (let i = 0; i < vals.length; i++) {
      const v = vals[i];
      if (v == null || !isFinite(v)) continue;
      const x = xScale(i), y = yScaleFn(v);
      d += (started ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
      started = true;
    }
    return d;
  };
  const area = (vals) => {
    if (!vals.length) return "";
    const ys = [];
    for (let i = 0; i < vals.length; i++) {
      const v = vals[i];
      if (v == null || !isFinite(v)) continue;
      ys.push({ x: xScale(i), y: yScaleFn(v) });
    }
    if (!ys.length) return "";
    let d = `M ${ys[0].x},${yScaleFn(baseline)} `;
    for (const p of ys) d += `L ${p.x},${p.y} `;
    d += `L ${ys[ys.length - 1].x},${yScaleFn(baseline)} Z`;
    return d;
  };

  // y 그리드 (5개)
  const yTicks = useMemo(() => {
    const ticks = [];
    for (let i = 0; i <= 4; i++) {
      ticks.push(yMin + ((yMax - yMin) * i) / 4);
    }
    return ticks;
  }, [yMin, yMax]);

  // x 그리드 (연도)
  const xTicks = useMemo(() => {
    const out = [];
    let prevY = null;
    for (let i = 0; i < dates.length; i++) {
      const y = dates[i].slice(0, 4);
      if (y !== prevY) {
        out.push({ i, label: y });
        prevY = y;
      }
    }
    return out;
  }, [dates]);

  function onMove(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - rect.left - margin.l;
    if (x < 0 || x > innerW) { setHoverX(null); return; }
    const idx = Math.round((x / innerW) * xN);
    setHoverX(Math.max(0, Math.min(xN, idx)));
  }

  return (
    <div ref={containerRef} className="chart-wrap" onMouseLeave={() => setHoverX(null)}>
      <svg width={W} height={H} onMouseMove={onMove} style={{ display: "block" }}>
        <defs>
          {series.map((s, idx) => (
            <linearGradient key={idx} id={`grad-${idx}`} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={s.color} stopOpacity="0.18" />
              <stop offset="100%" stopColor={s.color} stopOpacity="0" />
            </linearGradient>
          ))}
        </defs>
        {/* y 그리드 */}
        {yTicks.map((t, i) => (
          <g key={i}>
            <line
              x1={margin.l} x2={W - margin.r}
              y1={yScaleFn(t)} y2={yScaleFn(t)}
              className="grid-line"
            />
            <text
              x={margin.l - 8}
              y={yScaleFn(t) + 4}
              className="axis-label"
              textAnchor="end"
            >{yFormat(t)}</text>
          </g>
        ))}
        {/* baseline */}
        <line
          x1={margin.l} x2={W - margin.r}
          y1={yScaleFn(baseline)} y2={yScaleFn(baseline)}
          className="grid-baseline"
        />
        {/* x 라벨 */}
        {xTicks.map((t, idx) => (
          <text
            key={idx}
            x={xScale(t.i)}
            y={H - 8}
            className="axis-label"
            textAnchor="start"
          >{t.label}</text>
        ))}
        {/* 영역 + 라인 */}
        {series.map((s, idx) => (
          <g key={idx}>
            {s.fill !== false && (
              <path d={area(s.values)} fill={`url(#grad-${idx})`} />
            )}
            <path
              d={path(s.values)}
              fill="none"
              stroke={s.color}
              strokeWidth={s.width ?? 2}
              strokeDasharray={s.dashed ? "4 4" : undefined}
            />
          </g>
        ))}
        {/* 호버 */}
        {hoverX != null && (
          <g>
            <line
              x1={xScale(hoverX)} x2={xScale(hoverX)}
              y1={margin.t} y2={H - margin.b}
              className="hover-line"
            />
            {series.map((s, i) => {
              const v = s.values[hoverX];
              if (v == null) return null;
              return (
                <circle
                  key={i}
                  cx={xScale(hoverX)} cy={yScaleFn(v)}
                  r={4} fill={s.color} stroke="var(--bg-elev)" strokeWidth="2"
                />
              );
            })}
          </g>
        )}
      </svg>
      {hoverX != null && (
        <div className="chart-tooltip" style={{
          left: Math.min(xScale(hoverX) + 12, W - 200),
          top: margin.t + 8,
        }}>
          <div className="t-date">{dates[hoverX]}</div>
          {series.map((s, i) => (
            <div className="t-row" key={i}>
              <span className="t-dot" style={{ background: s.color }}></span>
              <span className="t-name">{s.name}</span>
              <span className="t-val">{yFormat(s.values[hoverX])}</span>
            </div>
          ))}
        </div>
      )}
      {showLegend && (
        <div className="chart-legend">
          {series.map((s, i) => (
            <div key={i} className="legend-item">
              <span className="dot" style={{ background: s.color, opacity: s.dashed ? 0.5 : 1 }}></span>
              <span>{s.name}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- 드로다운 영역 차트 ----------
function DrawdownChart({ dates, drawdown, benchDrawdown, height = 200 }) {
  const containerRef = useRef(null);
  const [width, setWidth] = useState(800);
  useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver(([e]) => setWidth(e.contentRect.width));
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);
  const margin = { l: 56, r: 16, t: 12, b: 24 };
  const W = width, H = height;
  const innerW = W - margin.l - margin.r;
  const innerH = H - margin.t - margin.b;
  const minY = Math.min(-0.05, ...drawdown, ...(benchDrawdown || []));
  const xN = dates.length - 1;
  const xS = (i) => margin.l + (i / Math.max(xN, 1)) * innerW;
  const yS = (v) => margin.t + (1 - (v - minY) / (0 - minY)) * innerH;
  const buildArea = (arr) => {
    let d = `M ${xS(0)},${yS(0)} `;
    for (let i = 0; i < arr.length; i++) d += `L ${xS(i)},${yS(arr[i])} `;
    d += `L ${xS(arr.length - 1)},${yS(0)} Z`;
    return d;
  };
  const xTicks = [];
  let prevY = null;
  for (let i = 0; i < dates.length; i++) {
    const y = dates[i].slice(0, 4);
    if (y !== prevY) { xTicks.push({ i, label: y }); prevY = y; }
  }
  const yTicks = [0, minY / 2, minY];
  return (
    <div ref={containerRef} className="chart-wrap">
      <svg width={W} height={H} style={{ display: "block" }}>
        {yTicks.map((t, i) => (
          <g key={i}>
            <line x1={margin.l} x2={W - margin.r} y1={yS(t)} y2={yS(t)} className="grid-line" />
            <text x={margin.l - 8} y={yS(t) + 4} className="axis-label" textAnchor="end">{fmtPct(t, 1)}</text>
          </g>
        ))}
        {benchDrawdown && (
          <path d={buildArea(benchDrawdown)} fill="var(--bench)" opacity="0.18" />
        )}
        <path d={buildArea(drawdown)} fill="var(--down)" opacity="0.45" />
        <path d={buildArea(drawdown).split(" Z")[0]} fill="none" stroke="var(--down)" strokeWidth="1.5" />
        {xTicks.map((t, i) => (
          <text key={i} x={xS(t.i)} y={H - 6} className="axis-label" textAnchor="start">{t.label}</text>
        ))}
      </svg>
    </div>
  );
}

// ---------- 월별 히트맵 ----------
function MonthlyHeatmap({ monthly }) {
  const byYear = useMemo(() => {
    const o = {};
    for (const r of monthly) {
      const [y, m] = r.month.split("-");
      if (!o[y]) o[y] = {};
      o[y][parseInt(m)] = r.ret;
    }
    return o;
  }, [monthly]);
  const years = Object.keys(byYear).sort();
  const months = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
  const colorFor = (v) => {
    if (v == null) return "var(--bg-2)";
    const mag = Math.min(Math.abs(v) / 0.08, 1);
    if (v >= 0) return `color-mix(in oklab, var(--up) ${mag * 70 + 12}%, var(--bg-elev))`;
    return `color-mix(in oklab, var(--down) ${mag * 70 + 12}%, var(--bg-elev))`;
  };
  return (
    <div className="heatmap">
      <div className="hm-row hm-head">
        <div className="hm-cell hm-year"></div>
        {months.map((m, i) => <div key={i} className="hm-cell hm-label">{m}</div>)}
        <div className="hm-cell hm-label">연간</div>
      </div>
      {years.map((y) => {
        const yr = byYear[y];
        // 연간 수익률 = 월별 누적
        let cum = 1;
        for (let m = 1; m <= 12; m++) if (yr[m] != null) cum *= 1 + yr[m];
        const annual = cum - 1;
        return (
          <div className="hm-row" key={y}>
            <div className="hm-cell hm-year">{y}</div>
            {months.map((_, i) => {
              const v = yr[i + 1];
              return (
                <div
                  key={i}
                  className="hm-cell"
                  style={{ background: colorFor(v), color: v == null ? "var(--fg-dim)" : "var(--fg)" }}
                  title={v != null ? fmtPctSign(v, 2) : ""}
                >
                  {v == null ? "" : fmtPctSign(v, 1)}
                </div>
              );
            })}
            <div
              className="hm-cell hm-annual"
              style={{ background: colorFor(annual), color: "var(--fg)" }}
            >{fmtPctSign(annual, 1)}</div>
          </div>
        );
      })}
    </div>
  );
}

// ---------- RSI / MACD 보조 차트 ----------
function IndicatorPanel({ dates, rsiArr, macdObj, height = 220 }) {
  const containerRef = useRef(null);
  const [width, setWidth] = useState(800);
  useEffect(() => {
    if (!containerRef.current) return;
    const ro = new ResizeObserver(([e]) => setWidth(e.contentRect.width));
    ro.observe(containerRef.current);
    return () => ro.disconnect();
  }, []);
  const margin = { l: 56, r: 16, t: 12, b: 22 };
  const W = width, H = height;
  const innerW = W - margin.l - margin.r;
  const half = (H - margin.t - margin.b) / 2;
  const xN = dates.length - 1;
  const xS = (i) => margin.l + (i / Math.max(xN, 1)) * innerW;

  // RSI in top half
  const yRsi = (v) => margin.t + (1 - (v - 0) / 100) * half;
  let rsiPath = "", started = false;
  for (let i = 0; i < rsiArr.length; i++) {
    if (rsiArr[i] == null) continue;
    rsiPath += (started ? "L" : "M") + xS(i).toFixed(1) + "," + yRsi(rsiArr[i]).toFixed(1) + " ";
    started = true;
  }

  // MACD histogram in bottom half
  const histVals = macdObj.hist.filter((v) => v != null);
  const histMax = Math.max(...histVals.map(Math.abs), 1);
  const yMacdMid = margin.t + half + half / 2;
  const yMacd = (v) => yMacdMid - (v / histMax) * (half / 2 - 4);

  // signal/line
  const lineMax = Math.max(...macdObj.line.filter((v) => v != null).map(Math.abs), 1);
  const yLine = (v) => yMacdMid - (v / lineMax) * (half / 2 - 4);

  const xTicks = [];
  let prevY = null;
  for (let i = 0; i < dates.length; i++) {
    const y = dates[i].slice(0, 4);
    if (y !== prevY) { xTicks.push({ i, label: y }); prevY = y; }
  }

  return (
    <div ref={containerRef} className="chart-wrap">
      <svg width={W} height={H} style={{ display: "block" }}>
        {/* RSI background bands */}
        <rect x={margin.l} y={yRsi(70)} width={innerW} height={yRsi(30) - yRsi(70)} fill="var(--accent)" opacity="0.04" />
        <line x1={margin.l} x2={W - margin.r} y1={yRsi(70)} y2={yRsi(70)} className="grid-line" />
        <line x1={margin.l} x2={W - margin.r} y1={yRsi(30)} y2={yRsi(30)} className="grid-line" />
        <line x1={margin.l} x2={W - margin.r} y1={yRsi(50)} y2={yRsi(50)} className="grid-baseline" />
        <text x={margin.l - 8} y={yRsi(70) + 4} className="axis-label" textAnchor="end">70</text>
        <text x={margin.l - 8} y={yRsi(30) + 4} className="axis-label" textAnchor="end">30</text>
        <text x={margin.l + 4} y={margin.t + 12} className="axis-label" style={{ fill: "var(--fg-dim)" }}>RSI(14)</text>
        <path d={rsiPath} fill="none" stroke="var(--accent)" strokeWidth="1.6" />

        {/* MACD */}
        <line x1={margin.l} x2={W - margin.r} y1={yMacdMid} y2={yMacdMid} className="grid-baseline" />
        <text x={margin.l + 4} y={margin.t + half + 14} className="axis-label" style={{ fill: "var(--fg-dim)" }}>MACD(12,26,9)</text>
        {/* histogram */}
        {macdObj.hist.map((v, i) => {
          if (v == null) return null;
          const x = xS(i);
          const y0 = yMacdMid;
          const y1 = yMacd(v);
          return (
            <line key={i} x1={x} x2={x} y1={y0} y2={y1}
              stroke={v >= 0 ? "var(--up)" : "var(--down)"}
              strokeWidth="1.2" opacity="0.7"
            />
          );
        })}
        {/* macd line + signal */}
        {(() => {
          let p1 = "", s1 = false;
          for (let i = 0; i < macdObj.line.length; i++) {
            if (macdObj.line[i] == null) continue;
            p1 += (s1 ? "L" : "M") + xS(i).toFixed(1) + "," + yLine(macdObj.line[i]).toFixed(1) + " ";
            s1 = true;
          }
          let p2 = "", s2 = false;
          for (let i = 0; i < macdObj.signal.length; i++) {
            if (macdObj.signal[i] == null) continue;
            p2 += (s2 ? "L" : "M") + xS(i).toFixed(1) + "," + yLine(macdObj.signal[i]).toFixed(1) + " ";
            s2 = true;
          }
          return (
            <g>
              <path d={p1} fill="none" stroke="var(--macd-line)" strokeWidth="1.4" />
              <path d={p2} fill="none" stroke="var(--macd-sig)" strokeWidth="1.4" />
            </g>
          );
        })()}
        {xTicks.map((t, i) => (
          <text key={i} x={xS(t.i)} y={H - 6} className="axis-label" textAnchor="start">{t.label}</text>
        ))}
      </svg>
    </div>
  );
}

// ---------- 스파크라인 ----------
function Sparkline({ values, height = 36, width = 120, color = "var(--accent)", baseline }) {
  const valid = values.filter((v) => v != null && isFinite(v));
  if (!valid.length) return <svg width={width} height={height} />;
  const min = Math.min(...valid, baseline ?? Infinity);
  const max = Math.max(...valid, baseline ?? -Infinity);
  const span = max - min || 1;
  const xN = values.length - 1;
  let d = "", started = false;
  for (let i = 0; i < values.length; i++) {
    const v = values[i]; if (v == null) continue;
    const x = (i / Math.max(xN, 1)) * (width - 2) + 1;
    const y = (1 - (v - min) / span) * (height - 2) + 1;
    d += (started ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1) + " ";
    started = true;
  }
  const last = valid[valid.length - 1];
  const first = valid[0];
  const stroke = last >= first ? "var(--up)" : "var(--down)";
  return (
    <svg width={width} height={height} className="sparkline">
      <path d={d} fill="none" stroke={color === "auto" ? stroke : color} strokeWidth="1.5" />
    </svg>
  );
}

});

function estimateBuys(cfg) {
  const days = (new Date(cfg.endDate) - new Date(cfg.startDate)) / (86400000);
  if (cfg.dcaPeriod === "weekly") return Math.max(1, Math.round(days / 7));
  if (cfg.dcaPeriod === "monthly") return Math.max(1, Math.round(days / 30));
  return Math.max(1, Math.round(days / 91));
}

function RunLog({ cfg, result, isRunning, progress }) {

  if (cfg.dipBuyEnabled) lines.push({ t: "[INFO]", msg: `하락시 추가매수 활성 · 임계 ${(cfg.dipDrop * 100).toFixed(1)}% · 배수 ${cfg.dipMultiplier}×` });

  if (isRunning) {
    lines.push({ t: "[RUN]", msg: `데이터 적재 · 지표 계산 (RSI, MACD, SMA)…`, status: progress < 0.3 ? "active" : "done" });
    lines.push({ t: "[RUN]", msg: `시계열 시뮬레이션 진행…`, status: progress < 0.9 ? "active" : "done" });
  }
  if (result) {
    lines.push({ t: "[OK]", msg: `시뮬레이션 완료 · ${result.dates.length} 거래일 처리` });
    lines.push({ t: "[OK]", msg: `매수 ${result.summary.buyCount}회, 매도 ${result.summary.sellCount}회 체결` });
    lines.push({ t: "[OK]", msg: `최종 평가금액 ${fmtKRW(result.summary.finalEquity, false)} (${fmtPctSign(result.summary.totalReturn)})` });

  }
  return (
    <div className="log-stream">
      {lines.map((l, i) => (
        <div key={i} className={`log-line ${l.status || ""}`}>
          <span className="log-t">{l.t}</span>
          <span className="log-msg">{l.msg}</span>
        </div>
      ))}
      {isRunning && <div className="log-cursor">_</div>}
    </div>
  );
}

              { name: `${cfg.universe} 벤치마크 (DCA)`, values: benchPct, color: "var(--bench)", dashed: true, fill: false },
            ]}

          />
        )}

          <LineChart
            dates={result.dates}
            series={[
              { name: "평가금액", values: result.equity, color: "var(--accent)" },
              { name: "누적 적립금", values: result.invested, color: "var(--fg-dim)", dashed: true, fill: false },
              { name: "벤치마크 평가금액", values: result.benchEquity, color: "var(--bench)", fill: false },
            ]}
            yFormat={(v) => fmtKRW(v)}
            baseline={0}
          />
        )}
        {tab === "drawdown" && (
          <DrawdownChart dates={result.dates} drawdown={result.drawdown} benchDrawdown={result.benchDrawdown} height={320} />
        )}
        {tab === "indicator" && (
          <div>
            <LineChart
              dates={result.dates}
              series={[
                { name: `${cfg.universe} 종가`, values: result.closes, color: "var(--fg)", fill: false },
                { name: "SMA(20)", values: result.sma20, color: "var(--accent)", dashed: true, fill: false },
                { name: "SMA(60)", values: result.sma60, color: "var(--macd-sig)", dashed: true, fill: false },
              ]}
              yFormat={(v) => v.toFixed(0)}
              height={260}
              baseline={result.closes[0]}
            />
            <IndicatorPanel dates={result.dates} rsiArr={result.rsi} macdObj={result.macd} height={220} />
          </div>
        )}
        {tab === "heatmap" && <MonthlyHeatmap monthly={result.monthly} />}
      </Card>
    </div>
  );
}

function EmptyResult() {
  return (
    <div className="view view-empty">
      <div className="empty-state">

        <h3>아직 실행된 백테스트가 없습니다.</h3>

    result.invested[i] > 0 ? v / result.invested[i] - 1 : 0

    result.benchInvested[i] > 0 ? v / result.benchInvested[i] - 1 : 0
  );
  const lumpPct = result.benchLump.map((v) => v / cfg.budget - 1);

  // 알파 (단순 차이)
  const alphaSeries = equityPct.map((v, i) => v - benchPct[i]);
  const sumStats = [
    { label: "포트폴리오 (전략)", ret: result.summary.totalReturn, mdd: result.summary.mdd, cagr: result.summary.cagr, vol: result.summary.annVol, sharpe: result.summary.sharpe, tone: "accent" },
    { label: `${cfg.universe} DCA 적립`, ret: result.summary.benchTotalRet, mdd: result.summary.benchMdd, cagr: null, vol: null, sharpe: null, tone: "bench" },
    { label: `${cfg.universe} 일시매수`, ret: result.benchLump[result.benchLump.length - 1] / cfg.budget - 1, mdd: null, cagr: null, vol: null, sharpe: null, tone: "muted" },

  return (
    <div className="view view-bench">
      <div className="view-head">
        <div>

      </div>

          dates={result.dates}
          series={[
            { name: "전략 포트폴리오", values: equityPct, color: "var(--accent)" },
            { name: `${cfg.universe} DCA 적립`, values: benchPct, color: "var(--bench)", fill: false },
            { name: `${cfg.universe} 일시매수`, values: lumpPct, color: "var(--fg-dim)", dashed: true, fill: false },
          ]}
          yFormat={(v) => fmtPctSign(v, 0)}
          height={360}
        />

      <Card title="알파 (전략 − 벤치마크)">
        <LineChart
          dates={result.dates}
          series={[
            { name: "초과 수익률", values: alphaSeries, color: "var(--up)" },

      </Card>

      <Card title="비교표">
        <table className="data-table">
          <thead>
            <tr>
              <th>시나리오</th>
              <th className="num">총 수익률</th>
              <th className="num">CAGR</th>
              <th className="num">MDD</th>

          </thead>
          <tbody>
            {sumStats.map((r, i) => (
              <tr key={i}>
                <td>
                  <span className={`badge badge-${r.tone}`}>{r.label}</span>

}

// 리스크 지표
// ============================================================
function RiskView({ result, cfg }) {
  if (!result) return <EmptyResult />;
  const s = result.summary;

  // 드로다운 종합
  const ddArr = result.drawdown;
  const recoveryDays = ddArr.findIndex((v, i) => i > ddArr.indexOf(Math.min(...ddArr)) && v === 0);
  const mddIdx = ddArr.indexOf(Math.min(...ddArr));
  const mddDate = result.dates[mddIdx];

  // 일일 수익률 분포 (히스토그램)
  const dailyRets = [];
  for (let i = 1; i < result.equity.length; i++) {
    const depDelta = result.invested[i] - result.invested[i - 1];
    const base = result.equity[i - 1] + depDelta;
    if (base > 0) dailyRets.push(result.equity[i] / base - 1);
  }
  const histBins = 25;
  const lo = Math.min(...dailyRets), hi = Math.max(...dailyRets);
  const binW = (hi - lo) / histBins;
  const bins = new Array(histBins).fill(0);
  for (const r of dailyRets) {
    const k = Math.min(histBins - 1, Math.max(0, Math.floor((r - lo) / binW)));
    bins[k]++;
  }
  const maxBin = Math.max(...bins);

  return (
    <div className="view view-risk">
      <div className="view-head">
        <div>
          <h2>리스크 지표</h2>
          <p className="view-sub">변동성·하방위험·최대 손실 — Goldman style risk dashboard</p>
        </div>
      </div>

      <div className="kpi-grid kpi-grid-4">
        <KPI label="MDD (최대 낙폭)" tone="down"
          value={fmtPct(s.mdd, 2)}
          sub={`${mddDate}`} />
        <KPI label="변동성 (연환산)"
          value={fmtPct(s.annVol, 1)}
          sub="일일 수익률 std × √252" />
        <KPI label="Sharpe Ratio"
          value={fmtNum(s.sharpe, 2)}
          sub="rf = 3.0%" />
        <KPI label="Sortino Ratio"
          value={fmtNum(s.sortino, 2)}
          sub="하방 변동성 기반" />
        <KPI label="Calmar Ratio"
          value={fmtNum(s.calmar, 2)}
          sub="CAGR / |MDD|" />
        <KPI label="승률 (매도)"
          value={fmtPct(s.winRate, 1)}
          sub={`${s.sellCount}회 매도 중 익절`} />
        <KPI label="α (vs 벤치마크)"
          tone={s.alpha >= 0 ? "up" : "down"}
          value={fmtPctSign(s.alpha)} sub={cfg.universe} />
        <KPI label="현금 비중 (최종)"
          value={fmtPct(s.cashReserve / Math.max(s.finalEquity, 1), 1)}
          sub={fmtKRW(s.cashReserve)} />
      </div>

      <Card title="드로다운 곡선 (전략 vs 벤치마크)">
        <DrawdownChart
          dates={result.dates}
          drawdown={result.drawdown}
          benchDrawdown={result.benchDrawdown}
          height={280}
        />
      </Card>

      <div className="grid-2col">
        <Card title="일일 수익률 분포">
          <div className="histogram">
            <svg width="100%" height="180" viewBox={`0 0 ${histBins * 14} 180`} preserveAspectRatio="none">
              {bins.map((c, i) => {
                const h = (c / maxBin) * 160;
                const center = lo + (i + 0.5) * binW;
                return (
                  <rect
                    key={i}
                    x={i * 14 + 1} y={170 - h}
                    width="12" height={h}
                    fill={center >= 0 ? "var(--up)" : "var(--down)"}
                    opacity="0.7"
                  />
                );
              })}
              <line x1={(((-lo) / binW) * 14)} y1="10" x2={(((-lo) / binW) * 14)} y2="170"
                stroke="var(--fg-dim)" strokeDasharray="4 4" />
            </svg>
            <div className="hist-axis">
              <span>{fmtPct(lo, 2)}</span>
              <span>0%</span>
              <span>{fmtPct(hi, 2)}</span>
            </div>
          </div>
        </Card>

        <Card title="리스크 해석" dense>
          <ul className="risk-notes">
            <li>
              <span className="rn-label">MDD</span>
              <span className="rn-text">
                포트폴리오는 최고점 대비 <b className="down">{fmtPct(s.mdd, 1)}</b> 하락 경험.
                벤치마크는 <b>{fmtPct(s.benchMdd, 1)}</b>.
                {Math.abs(s.mdd) < Math.abs(s.benchMdd) ? " 매도 조건이 하방 보호에 기여." : " 매도 조건이 하방 보호에 충분치 않음."}
              </span>
            </li>
            <li>
              <span className="rn-label">Sharpe</span>
              <span className="rn-text">
                {s.sharpe >= 1 ? "양호. 위험 대비 수익이 안정적." : s.sharpe >= 0.5 ? "보통 수준." : "위험 대비 보상이 낮음."}
              </span>
            </li>
            <li>
              <span className="rn-label">α</span>
              <span className="rn-text">
                {s.alpha >= 0
                  ? <>벤치마크 대비 <b className="up">+{fmtPct(s.alpha, 1)}</b> 초과 수익.</>
                  : <>벤치마크 대비 <b className="down">{fmtPct(s.alpha, 1)}</b> 미달.</>}
              </span>
            </li>
            <li>
              <span className="rn-label">Calmar</span>
              <span className="rn-text">
                CAGR 대비 MDD 비율 = <b>{fmtNum(s.calmar, 2)}</b>.
                {s.calmar >= 0.5 ? " 회복 능력 우수." : " 손실 회복 속도가 느림."}
              </span>
            </li>
          </ul>
        </Card>
      </div>
    </div>
  );
}

Object.assign(window, {
  StrategyView, RunView, DashboardView, BenchmarkView, TradesView, RiskView,
  KPI, Card, Field, Seg,
});
