name: 📉 Market Trend Breakout Analysis (Hourly)

on:
  schedule:
    # 평일(월~금) 09:00~15:00 KST, 매 정시 실행 + 16:00 KST 장마감 확정본
    # KST = UTC+9  →  UTC 00:00~07:00
    - cron: '0 0 * * 1-5'   # 09:00 KST
    - cron: '0 1 * * 1-5'   # 10:00 KST
    - cron: '0 2 * * 1-5'   # 11:00 KST
    - cron: '0 3 * * 1-5'   # 12:00 KST (점심)
    - cron: '0 4 * * 1-5'   # 13:00 KST
    - cron: '0 5 * * 1-5'   # 14:00 KST
    - cron: '0 6 * * 1-5'   # 15:00 KST (장 마감 30분전)
    - cron: '0 7 * * 1-5'   # 16:00 KST (장마감 후 최종 확정가)
  workflow_dispatch:          # 수동 실행 가능

permissions:
  contents: write

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install pykrx scipy numpy

      - name: 📉 Run KOSPI+KOSDAQ combined analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 market_analysis.py

      - name: 💾 Commit & push report to docs/
        run: |
          git config user.name  "Winter Bot"
          git config user.email "winter-bot@github-actions"
          git add docs/
          git diff --staged --quiet || git commit -m "📉 Market trend analysis $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git push
