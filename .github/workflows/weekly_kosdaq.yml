name: 📉 Weekly Market Trend Breakout Analysis

on:
  schedule:
    - cron: '0 23 * * 0'   # 일요일 23:00 UTC = 월요일 08:00 KST
  workflow_dispatch:         # 수동 실행 가능

permissions:
  contents: write

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install pykrx scipy numpy

      - name: 📉 Run KOSPI+KOSDAQ combined analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 market_analysis.py

      - name: 💾 Commit & push report to docs/
        run: |
          git config user.name  "Winter Bot"
          git config user.email "winter-bot@github-actions"
          git add docs/
          git diff --staged --quiet || git commit -m "📉 Add market trend analysis $(date +'%Y-%m-%d')"
          git push
