name: 📊 Daily Korea Market Report (Weekdays 08:00 KST)

on:
  schedule:
    # 평일(월~금) 08:00 KST = 전날 UTC 23:00 (KST = UTC+9)
    # Sun 23:00 UTC → Mon 08:00 KST
    # Mon 23:00 UTC → Tue 08:00 KST
    # Tue 23:00 UTC → Wed 08:00 KST
    # Wed 23:00 UTC → Thu 08:00 KST
    # Thu 23:00 UTC → Fri 08:00 KST
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
    # 수동 실행 (테스트용)

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📊 Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USAGE_DISPATCH_TOKEN: ${{ secrets.USAGE_DISPATCH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_report.py

      - name: 💾 Commit & push report to docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "📊 Daily report $(date +'%Y-%m-%d') 08:00 KST"
          git push
