services:
  # --- API Server ---
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - workspace:/workspace
      - ./eval:/app/eval:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Eval Worker (async evaluation jobs) ---
  eval-worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "agent_platform.eval.worker"]
    env_file: .env
    volumes:
      - workspace:/workspace
      - ./eval:/app/eval:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Redis (session state + eval job queue) ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  workspace:
  redis-data:
